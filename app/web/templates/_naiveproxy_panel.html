<article id="sg-naiveproxy-settings"
         class="cnv1-compact-protocol-card naiveproxy-compact-card sg-ljd-nested"
         data-naiveproxy-panel>
  <header class="cnv1-compact-protocol-head">
    <div class="cnv1-compact-protocol-title">
      <span class="cnv1-compact-protocol-icon">NP</span>
      <div>
        <h3>NaiveProxy</h3>
        <p>HTTPS proxy · TLS</p>
      </div>
    </div>
    <span class="cnv1-engine-status warning" data-naive-state><span></span><b>Проверка…</b></span>
  </header>

  <div class="cnv1-compact-protocol-endpoint naiveproxy-endpoint-row">
    <div class="naiveproxy-endpoint-copy">
      <span>HTTPS-домен</span>
      <strong data-naive-host>—</strong>
    </div>
    <button class="button primary" type="button" data-naive-submit>Проверить и применить</button>
  </div>
</article>

<script>
(() => {
  const root = document.querySelector('[data-naiveproxy-panel]');
  if (!root) return;

  const host = root.querySelector('[data-naive-host]');
  const state = root.querySelector('[data-naive-state]');
  const stateText = state?.querySelector('b');
  const submit = root.querySelector('[data-naive-submit]');
  let activePort = 8447;

  const paintState = (healthy, label) => {
    if (!state) return;
    state.classList.toggle('success', healthy);
    state.classList.toggle('warning', !healthy);
    if (stateText) stateText.textContent = label;
  };

  const load = async () => {
    const response = await fetch('/api/naiveproxy/status', {
      credentials: 'same-origin',
      headers: {'X-Requested-With': 'XMLHttpRequest'}
    });
    const payload = await response.json();
    const runtime = payload.runtime || {};
    activePort = Number(payload.port || payload.default_port || 8447);
    const domain = payload.host || '';
    if (host) host.textContent = domain || 'HTTPS не настроен';
    const healthy = response.ok && payload.status === 'ok' && runtime.ok === true;
    paintState(healthy, healthy ? 'Работает' : 'Не настроен');
    return payload;
  };

  submit?.addEventListener('click', async () => {
    submit.disabled = true;
    const originalLabel = submit.textContent;
    submit.textContent = 'Применение…';
    try {
      const response = await fetch('/api/naiveproxy/settings', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {
          'Content-Type': 'application/json',
          'X-Requested-With': 'XMLHttpRequest'
        },
        body: JSON.stringify({port: Number(activePort)})
      });
      const payload = await response.json();
      if (!response.ok || payload.ok !== true) {
        throw new Error(payload.message || 'Настройки не применены');
      }
      await load();
    } catch (error) {
      paintState(false, 'Ошибка');
      state?.setAttribute('title', error.message || 'Настройки не применены');
    } finally {
      submit.disabled = false;
      submit.textContent = originalLabel;
    }
  });

  load().catch(error => {
    paintState(false, 'Недоступен');
    state?.setAttribute('title', error.message || 'Статус недоступен');
  });
})();
</script>
