name: Bootstrap SG-Gateway 23.01 source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-from-v22.yml'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.bootstrap-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-2301-source
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v23 destination
        uses: actions/checkout@v4
        with:
          repository: s-gor/sg-gateway-v23
          ref: main
          fetch-depth: 0
          path: target

      - name: Checkout frozen v22 runtime source read-only
        uses: actions/checkout@v4
        with:
          repository: s-gor/sg-gateway-v22
          ref: 6d8b07125289566a6e8a7ba206094d8969e92125
          fetch-depth: 1
          persist-credentials: false
          path: source

      - name: Copy runtime snapshot into v23 bootstrap branch
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git switch -C bootstrap/2301-source
          cd ..

          rsync -a --delete \
            --exclude '/.git/' \
            --exclude '/docs/superpowers/***' \
            --exclude '/.github/workflows/***' \
            --exclude '/PUBLICATION-02112.md' \
            --exclude '/PUBLICATION-02204.md' \
            --exclude '/PUBLICATION-02206.md' \
            --exclude '/PUBLICATION-02208.md' \
            source/ target/

          cd target
          git config user.name 'sg-gateway-v23-bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'chore: seed 23.01 from frozen 22.08 runtime' || true
          git push --force-with-lease origin bootstrap/2301-source

      - name: Assert no v22 remote is writable
        shell: bash
        run: |
          set -euo pipefail
          cd source
          test "$(git remote get-url origin)" = "https://github.com/s-gor/sg-gateway-v22"
          if git config --get remote.origin.pushurl >/dev/null 2>&1; then
            echo 'Unexpected push URL configured for v22 source checkout' >&2
            exit 1
          fi
          echo 'v22 checkout is read-only; bootstrap wrote only to v23.'
