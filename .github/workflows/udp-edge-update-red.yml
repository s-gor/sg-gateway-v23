name: UDP Edge Update RED

on:
  push:
    branches:
      - feat/2301-single-edge-443

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2301-single-edge-443
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<9'
      - run: python -m pytest -q tests/test_2301_udp_edge_update_rollout.py
