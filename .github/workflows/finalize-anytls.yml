name: Finalize AnyTLS fix

on:
  push:
    branches: [feat/2301-single-edge-443]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix regression assertion and refresh source integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess

          test = Path('tests/test_2301_single_edge_tls_hub.py')
          text = test.read_text(encoding='utf-8')
          old = '    finish = updater.index("bind_panel_update_state")\n'
          new = '    finish = updater.index("\\nbind_panel_update_state\\n", stage10)\n'
          if old not in text:
              raise SystemExit('expected bind_panel_update_state assertion not found')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          paths = [
              rel for rel in tracked
              if rel != 'SOURCE-SHA256SUMS' and not rel.startswith('.github/workflows/')
          ]
          rows = [f"{hashlib.sha256(Path(rel).read_bytes()).hexdigest()}  {rel}" for rel in paths]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git rm -f .github/workflows/target-anytls.yml .github/workflows/finalize-anytls.yml
          git config user.name "sg-gateway-ci"
          git config user.email "sg-gateway-ci@users.noreply.github.com"
          git add tests/test_2301_single_edge_tls_hub.py SOURCE-SHA256SUMS
          git commit -m "fix: finalize AnyTLS subscription transport contract"
          git push
