name: Temporary 23.01 Bootstrap Cleanup

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'bootstrap/2301-source'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply final legacy-contract cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess

          replacements = {
              'tests/test_sg_gateway_02112_final_cumulative_cleanup_r5.py': (
                  "assert text.count(f'before-sg-gateway-{token}') == 2",
                  "assert text.count('before-sg-gateway-') == 2",
              ),
              'tests/test_sg_gateway_v22_02206_hardening.py': (
                  "assert installer.count(f'before-sg-gateway-{token}') == 2",
                  "assert installer.count('before-sg-gateway-') == 2",
              ),
          }
          for path, (old, new) in replacements.items():
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'missing expected assertion in {path}')
              p.write_text(s.replace(old, new), encoding='utf-8', newline='\n')

          tracked = sorted(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          tracked = [x for x in tracked if x != 'SOURCE-SHA256SUMS']
          with Path('SOURCE-SHA256SUMS').open('w', encoding='utf-8', newline='\n') as out:
              for rel in tracked:
                  out.write(f"{hashlib.sha256(Path(rel).read_bytes()).hexdigest()}  {rel}\n")
          PY

          git config user.name "sg-gateway-v23-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "test: remove stale versioned backup-marker assumptions"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
