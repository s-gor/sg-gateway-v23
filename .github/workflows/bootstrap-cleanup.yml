name: Temporary 23.01 Bootstrap Cleanup

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'bootstrap/2301-source'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply final 23.01 installer identity fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess

          p = Path('install.sh')
          s = p.read_text(encoding='utf-8')
          old = 'before-sg-gateway-02208'
          new = 'before-sg-gateway-02301'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 legacy backup markers, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8', newline='\n')

          tracked = sorted(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          tracked = [x for x in tracked if x != 'SOURCE-SHA256SUMS']
          with Path('SOURCE-SHA256SUMS').open('w', encoding='utf-8', newline='\n') as out:
              for rel in tracked:
                  out.write(f"{hashlib.sha256(Path(rel).read_bytes()).hexdigest()}  {rel}\n")
          PY

          git config user.name "sg-gateway-v23-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "fix: complete 23.01 installer identity"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
