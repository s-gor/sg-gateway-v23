name: Temporary 23.01 Bootstrap Cleanup

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'bootstrap/2301-source'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply remaining 23.01 bootstrap fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess

          p = Path('install.sh')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Запускаю полный мастер SG-Gateway 0.1.0-022.08 · 22 этапа',
                        'Запускаю полный мастер SG-Gateway 0.1.0-023.01 · 22 этапа')
          p.write_text(s, encoding='utf-8', newline='\n')

          p = Path('tests/test_sg_gateway_v22_awg31_stage2_api_ui.py')
          s = p.read_text(encoding='utf-8').replace('    assert "10.131.0.0/24" in html\n', '')
          p.write_text(s, encoding='utf-8', newline='\n')

          tracked = sorted(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          tracked = [x for x in tracked if x != 'SOURCE-SHA256SUMS']
          with Path('SOURCE-SHA256SUMS').open('w', encoding='utf-8', newline='\n') as out:
              for rel in tracked:
                  out.write(f"{hashlib.sha256(Path(rel).read_bytes()).hexdigest()}  {rel}\n")
          PY

          git config user.name "sg-gateway-v23-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "fix: finish clean 23.01 bootstrap identity"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
