name: SG-Gateway 23.01 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/2301-sgnet-integration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go for SG-Net
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium

      - name: Check Python syntax
        id: python_syntax
        continue-on-error: true
        run: |
          python -B - <<'PY' > /tmp/python-syntax.txt 2>&1
          from pathlib import Path
          files=list(Path('app').rglob('*.py'))+list(Path('engines').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('tests').rglob('*.py'))
          failures = 0
          for p in files:
              try:
                  compile(p.read_text(encoding='utf-8'), str(p), 'exec')
              except Exception as exc:
                  failures += 1
                  print(f"{p}: {type(exc).__name__}: {exc}")
          if failures:
              raise SystemExit(1)
          print(f"syntax ok: {len(files)} files")
          PY

      - name: Upload Python syntax diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-syntax-diagnostics
          path: /tmp/python-syntax.txt
          if-no-files-found: error

      - name: Enforce Python syntax result
        if: steps.python_syntax.outcome != 'success'
        run: exit 1

      - name: Verify 23.01 repository identity
        run: python -m pytest -q tests/test_2301_repository_identity.py

      - name: Generate source integrity candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess

          tracked = sorted(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          expected = [
              rel for rel in tracked
              if rel != 'SOURCE-SHA256SUMS' and not rel.startswith('.github/workflows/')
          ]
          target = Path('/tmp/SOURCE-SHA256SUMS')
          target.write_text(
              ''.join(
                  f"{hashlib.sha256(Path(rel).read_bytes()).hexdigest()}  {rel}\n"
                  for rel in expected
              ),
              encoding='utf-8',
          )
          print(f"candidate source integrity: {len(expected)} files")
          PY

      - name: Upload source integrity candidate
        uses: actions/upload-artifact@v4
        with:
          name: source-sha256-candidate
          path: /tmp/SOURCE-SHA256SUMS
          if-no-files-found: error

      - name: Sync feature source integrity
        if: github.ref == 'refs/heads/feature/2301-sgnet-integration'
        run: |
          cp /tmp/SOURCE-SHA256SUMS SOURCE-SHA256SUMS
          if ! git diff --quiet -- SOURCE-SHA256SUMS; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add SOURCE-SHA256SUMS
            git commit -m "chore(sgnet): refresh source checksums"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify source integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess

          rows = Path('SOURCE-SHA256SUMS').read_text(encoding='utf-8').splitlines()
          listed = {}
          for line_no, raw in enumerate(rows, 1):
              if not raw.strip():
                  continue
              match = re.fullmatch(r'([0-9a-f]{64})  (.+)', raw)
              if not match:
                  raise SystemExit(f'invalid checksum line {line_no}: {raw!r}')
              digest, rel = match.groups()
              if rel in listed:
                  raise SystemExit(f'duplicate checksum path: {rel}')
              path = Path(rel)
              if not path.is_file():
                  raise SystemExit(f'missing checksummed file: {rel}')
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'checksum mismatch: {rel}')
              listed[rel] = digest

          tracked = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          expected = {
              rel for rel in tracked
              if rel != 'SOURCE-SHA256SUMS' and not rel.startswith('.github/workflows/')
          }
          if set(listed) != expected:
              missing = sorted(expected - set(listed))
              stale = sorted(set(listed) - expected)
              raise SystemExit(f'checksum inventory mismatch; missing={missing[:20]} stale={stale[:20]}')
          print(f'source integrity ok: {len(listed)} files')
          PY

      - name: Verify Xray recovery upgrade regression
        run: python -m pytest -q tests/test_preview31_xray_updates.py

      - name: Verify NaiveProxy Xray-state forwarding regression
        run: python -m pytest -q tests/test_naiveproxy_xray_state_forwarding_2301.py

      - name: Verify SG-Net Go runtime
        run: |
          cd runtime/sgnet
          go test ./... -race
          go vet ./...

      - name: Verify SG-Net security contracts
        run: python -m pytest -q tests/test_sgnet_security_regression.py tests/test_sgnet_single_edge.py

      - name: Run full 23.01 test suite
        id: full_pytest
        continue-on-error: true
        run: python -m pytest -q tests > /tmp/full-pytest.txt 2>&1

      - name: Upload full pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-pytest-diagnostics
          path: /tmp/full-pytest.txt
          if-no-files-found: error

      - name: Enforce full pytest result
        if: steps.full_pytest.outcome != 'success'
        run: exit 1
