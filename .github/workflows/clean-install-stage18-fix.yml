name: Repair clean-install stage18 runtime lock

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove current contract is RED
        run: |
          set -Eeuo pipefail
          set +e
          python - <<'PY'
          from pathlib import Path
          runtime = Path('hostd/sg_hostd/client_runtime.py').read_text(encoding='utf-8')
          assert 'LOCK_FILE = CANDIDATE_DIR / "clients-apply.lock"' in runtime
          assert '/run/sg-gateway/clients-apply.lock' not in runtime
          PY
          rc=$?
          set -e
          if (( rc == 0 )); then
            echo 'Expected pre-fix runtime-lock regression to fail, but it passed.' >&2
            exit 1
          fi
          echo 'RED confirmed: current clean-install lock path is unsafe under the hostd sandbox.'

      - name: Apply minimal runtime and installer UX fixes
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('hostd/sg_hostd/client_runtime.py')
          runtime = runtime_path.read_text(encoding='utf-8')
          old_lock = 'LOCK_FILE = Path("/run/sg-gateway/clients-apply.lock")'
          new_lock = 'LOCK_FILE = CANDIDATE_DIR / "clients-apply.lock"'
          if runtime.count(old_lock) != 1:
              raise SystemExit(f'expected exactly one legacy lock path, got {runtime.count(old_lock)}')
          runtime_path.write_text(runtime.replace(old_lock, new_lock), encoding='utf-8')

          old_sha = '(cd "$VENDOR_CORES_DIR" && sha256sum -c SHA256SUMS)'
          new_sha = '(cd "$VENDOR_CORES_DIR" && sha256sum -c --quiet SHA256SUMS)'
          old_vm = '[SG-Gateway] Этот же EC2 можно использовать повторно; пересоздавать сервер не нужно.'
          new_vm = '[SG-Gateway] Текущую машину можно использовать повторно; пересоздавать её не нужно.'
          for rel in ('install.sh', 'deploy/install-core.sh'):
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              if old_sha not in text:
                  raise SystemExit(f'vendor checksum command not found in {rel}')
              text = text.replace(old_sha, new_sha, 1)
              if old_vm in text:
                  text = text.replace(old_vm, new_vm)
              path.write_text(text, encoding='utf-8')

          test = Path('tests/test_2301_clean_install_stage18_runtime.py')
          test.write_text('''from pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef test_hostd_client_apply_lock_lives_in_writable_state_dir() -> None:\n    runtime = (ROOT / "hostd" / "sg_hostd" / "client_runtime.py").read_text(encoding="utf-8")\n    assert 'LOCK_FILE = CANDIDATE_DIR / "clients-apply.lock"' in runtime\n    assert '/run/sg-gateway/clients-apply.lock' not in runtime\n\n\ndef test_vendor_verification_is_quiet_and_installer_message_is_vm_neutral() -> None:\n    for rel in ("install.sh", "deploy/install-core.sh"):\n        text = (ROOT / rel).read_text(encoding="utf-8")\n        assert '(cd "$VENDOR_CORES_DIR" && sha256sum -c --quiet SHA256SUMS)' in text\n        assert 'Этот же EC2 можно использовать повторно' not in text\n''', encoding='utf-8')
          PY

      - name: Refresh source integrity
        run: |
          set -Eeuo pipefail
          git add hostd/sg_hostd/client_runtime.py install.sh deploy/install-core.sh tests/test_2301_clean_install_stage18_runtime.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          expected = sorted(
              rel for rel in tracked
              if rel != 'SOURCE-SHA256SUMS' and not rel.startswith('.github/workflows/')
          )
          rows = []
          for rel in expected:
              path = Path(rel)
              if not path.is_file():
                  raise SystemExit(f'tracked source file missing while refreshing checksums: {rel}')
              rows.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {rel}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS

      - name: Verify targeted regression
        run: |
          set -Eeuo pipefail
          python -m pip install --quiet pytest
          bash -n install.sh deploy/install-core.sh
          python -m pytest -q tests/test_2301_clean_install_stage18_runtime.py tests/test_2301_clean_install_reboot_ux.py
          git diff --cached --check

      - name: Commit fix
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make clean-install client apply lock writable'
          git push origin "HEAD:${GITHUB_REF_NAME}"
