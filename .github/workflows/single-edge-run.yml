name: Execute Single Edge 443
on:
  push:
    branches: [feat/2301-single-edge-443]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply implementation script
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/single-edge-apply.yml').read_text(encoding='utf-8')
          start=text.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=text.index("\n          PY\n", start)
          lines=text[start:end].splitlines()
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          Path('/tmp/apply-single-edge.py').write_text(code, encoding='utf-8')
          PY
          python /tmp/apply-single-edge.py
      - name: Test
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests/test_sg_gateway_v23_single_edge_443.py
          python -m pytest -q tests/test_preview31_xray_updates.py tests/test_naiveproxy_xray_state_forwarding_2301.py
          bash -n install.sh
          bash -n deploy/configure-panel-access.sh
      - name: Regenerate manifest and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          paths=sorted(p for p in subprocess.check_output(['git','ls-files'],text=True).splitlines() if p!='SOURCE-SHA256SUMS' and not p.startswith('.github/workflows/'))
          Path('SOURCE-SHA256SUMS').write_text(''.join(f'{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}\n' for p in paths),encoding='utf-8')
          PY
          git config user.name 'SG-Gateway CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app hostd install.sh deploy/configure-panel-access.sh tests SOURCE-SHA256SUMS
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: implement Single Edge 443'
          git push origin HEAD:feat/2301-single-edge-443
