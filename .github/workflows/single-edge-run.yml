name: Execute Single Edge 443
on:
  push:
    branches: [feat/2301-single-edge-443]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finish Single Edge production contract
        run: |
          python - <<'PY'
          from pathlib import Path

          def change(path, pairs):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      print(f'pattern absent in {path}: {old[:80]!r}')
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding='utf-8', newline='\n')
                  print('updated:', path)
              else:
                  print('unchanged:', path)

          change('hostd/sg_hostd/client_runtime.py', [
              ('tcp_listen = "127.0.0.1" if _dual_stack_enabled(runtime) else "0.0.0.0"', 'tcp_listen = "127.0.0.1"'),
              ('port=int(runtime.get("SG_GATEWAY_REALITY_INTERNAL_PORT") or 7443),', 'port=int(runtime.get("SG_GATEWAY_REALITY_INTERNAL_PORT") or 10443),'),
              ('listen=public_listen,\n        )\n        inbound["sniffing"] = sniffing\n        inbounds.append(inbound)\n\n    tls_needed', 'listen=tcp_listen,\n        )\n        inbound["sniffing"] = sniffing\n        inbounds.append(inbound)\n\n    tls_needed'),
          ])

          change('install.sh', [
              ('PLACEHOLDER_TLS_INTERNAL_PORT="7444"', 'PANEL_TLS_INTERNAL_PORT="10446"\nPLACEHOLDER_TLS_INTERNAL_PORT="7444"'),
              ('SG_GATEWAY_TLS_EDGE_SNI="${SG_GATEWAY_TLS_EDGE_SNI:-}"\nNAIVEPROXY_INTERNAL_PORT="10447"', 'SG_GATEWAY_TLS_EDGE_SNI="${SG_GATEWAY_TLS_EDGE_SNI:-}"\nNAIVEPROXY_INTERNAL_PORT="10447"\nSG_GATEWAY_TLS_EDGE_ROUTE=""\n[[ -n "$SG_GATEWAY_TLS_EDGE_SNI" ]] && SG_GATEWAY_TLS_EDGE_ROUTE="    ${SG_GATEWAY_TLS_EDGE_SNI} 127.0.0.1:${NAIVEPROXY_INTERNAL_PORT};"'),
              ('    ${SG_GATEWAY_TLS_EDGE_SNI} 127.0.0.1:${NAIVEPROXY_INTERNAL_PORT};', '${SG_GATEWAY_TLS_EDGE_ROUTE}'),
              ('SG_GATEWAY_REALITY_SNI=${REALITY_SNI}\n', 'SG_GATEWAY_REALITY_SNI=${REALITY_SNI}\nSG_GATEWAY_XHTTP_REALITY_SNI=${SG_GATEWAY_XHTTP_REALITY_SNI}\nSG_GATEWAY_TLS_EDGE_SNI=${SG_GATEWAY_TLS_EDGE_SNI}\n'),
              ('      "${PANEL_PORT}/tcp" "80/tcp" "${XRAY_PORT}/tcp" \\', '      "80/tcp" "${XRAY_PORT}/tcp" \\'),
              ("printf '[SG-Gateway] Панель:       https://%s:%s\\n' \"$final_https_domain\" \"$PANEL_PORT\"", "printf '[SG-Gateway] Панель:       https://%s/\\n' \"$final_https_domain\""),
          ])

          change('deploy/configure-panel-access.sh', [
              ('XRAY_INTERNAL_PORT="10443"; XHTTP_REALITY_INTERNAL_PORT="10444"; TLS_EDGE_INTERNAL_PORT="10447"; PLACEHOLDER_TLS_INTERNAL_PORT="7444"', 'XRAY_INTERNAL_PORT="10443"; XHTTP_REALITY_INTERNAL_PORT="10444"; PANEL_TLS_INTERNAL_PORT="10446"; TLS_EDGE_INTERNAL_PORT="10447"; PLACEHOLDER_TLS_INTERNAL_PORT="7444"'),
              ('XHTTP_REALITY_SNI="$(get_env "$RUNTIME_ENV" SG_GATEWAY_XHTTP_REALITY_SNI www.cloudflare.com)"; XHTTP_REALITY_SNI="${XHTTP_REALITY_SNI,,}"', 'XHTTP_REALITY_SNI="$(get_env "$RUNTIME_ENV" SG_GATEWAY_XHTTP_REALITY_SNI www.cloudflare.com)"; XHTTP_REALITY_SNI="${XHTTP_REALITY_SNI,,}"\nTLS_EDGE_SNI="$(get_env "$RUNTIME_ENV" SG_GATEWAY_TLS_EDGE_SNI \"\")"; TLS_EDGE_SNI="${TLS_EDGE_SNI,,}"'),
              ('write_stream_config(){ local default_backend="$1"; cat > "$STREAM_CONF" <<EOF', 'write_stream_config(){ local default_backend="$1" naive_route=""; [[ -n "$TLS_EDGE_SNI" ]] && naive_route="    $TLS_EDGE_SNI 127.0.0.1:$TLS_EDGE_INTERNAL_PORT;"; cat > "$STREAM_CONF" <<EOF'),
              ('    $HOST 127.0.0.1:$TLS_EDGE_INTERNAL_PORT;\n    default $default_backend;', '    $HOST 127.0.0.1:$PANEL_TLS_INTERNAL_PORT;\n$naive_route\n    default $default_backend;'),
              ('    listen $PUBLIC_PORT ssl;\n    listen [::]:$PUBLIC_PORT ssl;', '    listen 127.0.0.1:$PANEL_TLS_INTERNAL_PORT ssl;'),
              ('    error_page 497 =308 https://$domain:$PUBLIC_PORT\\$request_uri;', '    error_page 497 =308 https://$domain\\$request_uri;'),
              ('"https://$domain:$PUBLIC_PORT/health"', '"https://$domain/health"'),
              ('Панель HTTPS $PUBLIC_PORT: OK', 'Панель HTTPS 443: OK'),
              ('панель не отвечает на $PUBLIC_PORT после перезагрузки Nginx', 'панель не отвечает на 443 после перезагрузки Nginx'),
              ('log "HTTPS настроен: https://$HOST:$PUBLIC_PORT"', 'log "HTTPS настроен: https://$HOST/"'),
          ])

          p = Path('tests/test_sg_gateway_v23_single_edge_443.py')
          text = p.read_text(encoding='utf-8')
          if 'test_panel_https_is_internal_and_published_on_edge_443' not in text:
              text += '''\n\ndef test_panel_https_is_internal_and_published_on_edge_443():\n    text = (ROOT / "deploy/configure-panel-access.sh").read_text(encoding="utf-8")\n    assert 'PANEL_TLS_INTERNAL_PORT="10446"' in text\n    assert 'listen 127.0.0.1:$PANEL_TLS_INTERNAL_PORT ssl;' in text\n    assert 'listen $PUBLIC_PORT ssl;' not in text\n    assert '$HOST 127.0.0.1:$PANEL_TLS_INTERNAL_PORT;' in text\n    assert 'https://$domain:$PUBLIC_PORT' not in text\n\n\ndef test_xhttp_reality_backend_is_explicit_loopback():\n    text = (ROOT / "hostd/sg_hostd/client_runtime.py").read_text(encoding="utf-8")\n    assert 'tcp_listen = "127.0.0.1"' in text\n    assert 'listen=tcp_listen,' in text\n    assert 'tcp_listen = "127.0.0.1" if' not in text\n\n\ndef test_optional_naive_sni_cannot_generate_an_empty_nginx_map_key():\n    install = (ROOT / "install.sh").read_text(encoding="utf-8")\n    access = (ROOT / "deploy/configure-panel-access.sh").read_text(encoding="utf-8")\n    assert 'SG_GATEWAY_TLS_EDGE_ROUTE=""' in install\n    assert '${SG_GATEWAY_TLS_EDGE_ROUTE}' in install\n    assert 'naive_route=""' in access\n    assert '$naive_route' in access\n'''
              p.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Regenerate source integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          paths=sorted(p for p in subprocess.check_output(['git','ls-files'],text=True).splitlines() if p!='SOURCE-SHA256SUMS' and not p.startswith('.github/workflows/'))
          Path('SOURCE-SHA256SUMS').write_text(''.join(f'{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}\n' for p in paths),encoding='utf-8')
          PY
      - name: Verify focused contracts
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests/test_sg_gateway_v23_single_edge_443.py
          python -m pytest -q tests/test_preview31_xray_updates.py tests/test_naiveproxy_xray_state_forwarding_2301.py
          bash -n install.sh
          bash -n deploy/configure-panel-access.sh
      - name: Verify full suite
        run: python -m pytest -q tests
      - name: Commit completed Single Edge candidate
        run: |
          git config user.name 'SG-Gateway CI'
          git config user.email 'actions@users.noreply.github.com'
          git add hostd/sg_hostd/client_runtime.py install.sh deploy/configure-panel-access.sh tests/test_sg_gateway_v23_single_edge_443.py SOURCE-SHA256SUMS
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: implement Single Edge 443 complete'
          git push origin HEAD:feat/2301-single-edge-443
