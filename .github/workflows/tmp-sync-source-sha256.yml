name: tmp-sync-source-sha256

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2301-single-edge-443
          fetch-depth: 0
      - name: Rebuild source checksums
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          git ls-files -z \
            | while IFS= read -r -d '' f; do
                case "$f" in
                  .github/workflows/*|SOURCE-SHA256SUMS) continue ;;
                esac
                sha256sum "$f"
              done \
            | LC_ALL=C sort -k2,2 > "$tmp"
          mv "$tmp" SOURCE-SHA256SUMS
      - name: Commit manifest
        shell: bash
        run: |
          if git diff --quiet -- SOURCE-SHA256SUMS; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git commit -m "ci: sync source checksums"
          git push origin HEAD:feat/2301-single-edge-443
