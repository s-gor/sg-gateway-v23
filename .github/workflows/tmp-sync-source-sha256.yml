name: Temporary source checksum sync

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2301-single-edge-443
          fetch-depth: 0
      - name: Rebuild SOURCE-SHA256SUMS
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          tracked = sorted(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          expected = [rel for rel in tracked if rel != 'SOURCE-SHA256SUMS' and not rel.startswith('.github/workflows/')]
          rows = [f"{hashlib.sha256(Path(rel).read_bytes()).hexdigest()}  {rel}" for rel in expected]
          Path('SOURCE-SHA256SUMS').write_text("\n".join(rows) + "\n", encoding='utf-8')
          PY
      - name: Commit checksum manifest
        run: |
          if git diff --quiet -- SOURCE-SHA256SUMS; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git commit -m "ci: sync source checksums"
          git push origin HEAD:feat/2301-single-edge-443
