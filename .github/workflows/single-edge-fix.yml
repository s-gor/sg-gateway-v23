name: Apply Single Edge TLS/runtime fix

on:
  push:
    branches: [feat/2301-single-edge-443]
    paths:
      - .github/workflows/single-edge-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}')
              p.write_text(text.replace(old, new, count), encoding='utf-8', newline='\n')

          replace_exact(
              'deploy/configure-panel-access.sh',
              '''    listen 127.0.0.1:$PLACEHOLDER_TLS_INTERNAL_PORT ssl;\n    server_name $domain;\n    ssl_session_cache shared:SG_GATEWAY_PLACEHOLDER_TLS:5m;''',
              '''    listen 127.0.0.1:$PLACEHOLDER_TLS_INTERNAL_PORT ssl;\n    server_name $domain;\n    ssl_certificate $cert;\n    ssl_certificate_key $key;\n    ssl_session_cache shared:SG_GATEWAY_PLACEHOLDER_TLS:5m;''',
          )

          replace_exact(
              'hostd/sg_hostd/client_runtime.py',
              '            port=int(runtime.get("SG_GATEWAY_REALITY_INTERNAL_PORT") or 7443),',
              '            port=profile.port,',
          )
          replace_exact(
              'hostd/sg_hostd/client_runtime.py',
              '''            server_name=XHTTP_REALITY_DEFAULT_SNI,\n            private_key=private_key,\n            short_id=short_id,\n            listen=public_listen,''',
              '''            server_name=XHTTP_REALITY_DEFAULT_SNI,\n            private_key=private_key,\n            short_id=short_id,\n            listen="127.0.0.1",''',
          )
          replace_exact(
              'hostd/sg_hostd/client_runtime.py',
              '                "listen": tcp_listen,',
              '                "listen": "127.0.0.1",',
          )
          replace_exact(
              'hostd/sg_hostd/client_runtime.py',
              '    tcp_listen = "127.0.0.1" if _dual_stack_enabled(runtime) else "0.0.0.0"\n',
              '',
          )

          replace_exact(
              'app/clients/exports.py',
              'from app.single_edge import PUBLIC_TCP_PORT, XHTTP_REALITY_DEFAULT_SNI, XHTTP_REALITY_DEFAULT_SNI',
              'from app.single_edge import PUBLIC_TCP_PORT, XHTTP_REALITY_DEFAULT_SNI',
          )
          PY
      - name: Regenerate source integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          paths = sorted(
              p for p in subprocess.check_output(
                  ['git','ls-files','--cached','--others','--exclude-standard'], text=True
              ).splitlines()
              if p != 'SOURCE-SHA256SUMS' and not p.startswith('.github/workflows/')
          )
          Path('SOURCE-SHA256SUMS').write_text(
              ''.join(f'{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}\n' for p in paths),
              encoding='utf-8',
          )
          PY
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install chromium
      - name: Focused verification
        run: |
          python -m pytest -q tests/test_sg_gateway_v23_single_edge_443.py tests/test_2301_single_edge_tls_hub.py tests/test_preview54_sgpanel_vless_port.py tests/test_preview31_xray_updates.py tests/test_naiveproxy_xray_state_forwarding_2301.py
          bash -n deploy/configure-panel-access.sh
          bash -n install.sh
      - name: Full verification
        run: python -m pytest -q tests
      - name: Commit verified fix
        run: |
          git config user.name 'SG-Gateway CI'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy/configure-panel-access.sh hostd/sg_hostd/client_runtime.py app/clients/exports.py SOURCE-SHA256SUMS
          git commit -m 'fix: complete Single Edge TLS termination and loopback backends'
          git push origin HEAD:feat/2301-single-edge-443
