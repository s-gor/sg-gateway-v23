name: Apply panel separation

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved 63443 panel separation
        shell: bash
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old in text:
                  p.write_text(text.replace(old, new, 1), encoding="utf-8")
                  return
              if new not in text:
                  raise SystemExit("missing replacement in " + path + ": " + old[:80])

          hostd = "hostd/sg_hostd/naiveproxy_runtime.py"
          replace_once(hostd, "PANEL_GATEWAY_PORT = 10446", "PLACEHOLDER_HTTP_INTERNAL_PORT = 10446")
          replace_once(hostd, "reverse_proxy http://127.0.0.1:{PANEL_GATEWAY_PORT}", "reverse_proxy http://127.0.0.1:{PLACEHOLDER_HTTP_INTERNAL_PORT}")

          access = "deploy/configure-panel-access.sh"
          replace_once(access, 'XRAY_INTERNAL_PORT="10443"; XHTTP_REALITY_INTERNAL_PORT="10444"; TLS_EDGE_INTERNAL_PORT="10447"; PLACEHOLDER_TLS_INTERNAL_PORT="7444"; PANEL_HTTP_INTERNAL_PORT="10446"', 'XRAY_INTERNAL_PORT="10443"; XHTTP_REALITY_INTERNAL_PORT="10444"; TLS_EDGE_INTERNAL_PORT="10447"; PLACEHOLDER_TLS_INTERNAL_PORT="7444"; PLACEHOLDER_HTTP_INTERNAL_PORT="10446"')
          old_lines = [
              'server {',
              '    listen 127.0.0.1:$PANEL_HTTP_INTERNAL_PORT;',
              '    server_name $domain;',
              '    add_header X-Content-Type-Options "nosniff" always;',
          ]
          new_lines = [
              'server {',
              '    listen 127.0.0.1:$PLACEHOLDER_HTTP_INTERNAL_PORT;',
              '    server_name $domain;',
              '    root $PLACEHOLDER_ROOT;',
              '    index index.html;',
              '    location = / { try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; add_header X-Frame-Options "SAMEORIGIN" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; }',
              '    location = /index.html { try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; add_header X-Frame-Options "SAMEORIGIN" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; }',
              '    location / { return 404; }',
              '}',
              'server {',
              '    listen $PUBLIC_PORT ssl;',
              '    listen [::]:$PUBLIC_PORT ssl;',
              '    server_name $domain;',
              '    ssl_certificate $cert;',
              '    ssl_certificate_key $key;',
              '    ssl_session_cache shared:SG_GATEWAY_PANEL_TLS:5m;',
              '    add_header X-Content-Type-Options "nosniff" always;',
          ]
          replace_once(access, "\n".join(old_lines), "\n".join(new_lines))
          replace_once(access, '"https://$domain/health"', '"https://$domain:$PUBLIC_PORT/health"')
          replace_once(access, 'log "Панель HTTPS 443: OK"', 'log "Панель HTTPS $PUBLIC_PORT: OK"')
          replace_once(access, 'fail "панель не отвечает на 443 после перезагрузки Nginx (HTTP ${code:-000})"', 'fail "панель не отвечает на $PUBLIC_PORT после перезагрузки Nginx (HTTP ${code:-000})"')
          replace_once(access, 'log "HTTPS настроен: https://$HOST/"; log "Заглушка: http://$HOST/ и https://$HOST/";', 'log "Панель: https://$HOST:$PUBLIC_PORT/"; log "Заглушка: http://$HOST/ и https://$HOST/";')
          replace_once(access, 'log "HTTPS и fallback 443 обновлены"', 'log "Панель HTTPS и fallback 443 обновлены"')

          for path in ("app/naiveproxy/runtime.py", hostd):
              text = Path(path).read_text(encoding="utf-8")
              if "PANEL_GATEWAY_PORT" in text or "PLACEHOLDER_HTTP_INTERNAL_PORT = 10446" not in text:
                  raise SystemExit("stale TLS fallback contract in " + path)

          manifest = Path("SOURCE-SHA256SUMS")
          rows = []
          for raw in manifest.read_text(encoding="utf-8").splitlines():
              if not raw.strip():
                  continue
              _, rel = raw.split(None, 1)
              fp = Path(rel.strip())
              if not fp.is_file():
                  raise SystemExit("missing manifest file: " + str(fp))
              rows.append(sha256(fp.read_bytes()).hexdigest() + "  " + fp.as_posix())
          manifest.write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hostd/sg_hostd/naiveproxy_runtime.py deploy/configure-panel-access.sh SOURCE-SHA256SUMS
          git commit -m "fix: separate panel HTTPS from shared 443"
          git pull --rebase origin feat/2301-single-edge-443
          git push origin HEAD:feat/2301-single-edge-443
