name: Finish private UDP edge lifecycle

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2301-single-edge-443
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Apply private UDP edge fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, got {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          # Hysteria2 client links must advertise the public UDP 443 edge,
          # never the private Xray backend port.
          p = Path('app/clients/exports.py')
          text = p.read_text(encoding='utf-8')
          start = text.index('elif profile_id == "hysteria2":')
          end = text.index('\n    else:\n        body = ""', start)
          block = text[start:end]
          old = 'endpoint = format_host_port(host, profile.port)'
          if block.count(old) != 1:
              raise SystemExit(f'app/clients/exports.py: Hysteria2 endpoint anchor count={block.count(old)}')
          block = block.replace(old, 'endpoint = format_host_port(host, public_profile_port)', 1)
          p.write_text(text[:start] + block + text[end:], encoding='utf-8', newline='\n')

          # AWG31 must bind its private backend behind udp-edge.
          replace_once(
              'app/maintenance/awg31_stage3a_data.py',
              'from app.maintenance.awg31_stage3a_common import DNS, ENDPOINT, ENGINE_ID, INTERFACE, NETWORK\n',
              'from app.maintenance.awg31_stage3a_common import DNS, ENDPOINT, ENGINE_ID, INTERFACE, NETWORK\nfrom app.single_edge import AWG31_UDP_INTERNAL_PORT\n',
          )
          replace_once(
              'app/maintenance/awg31_stage3a_data.py',
              '                "ListenPort = 443",\n',
              '                f"ListenPort = {AWG31_UDP_INTERNAL_PORT}",\n',
          )

          # udp-edge owns public UDP 443 and must be started on clean install.
          replace_once(
              'install.sh',
              '  systemctl enable sg-gateway-udp-edge.service\n',
              '  systemctl enable --now "$UDP_EDGE_SERVICE"\n',
          )
          replace_once(
              'install.sh',
              '    sg-gateway-awg31.service sg-gateway-singbox.service sg-gateway-naiveproxy.service; do\n',
              '    sg-gateway-awg31.service sg-gateway-singbox.service sg-gateway-naiveproxy.service sg-gateway-udp-edge.service; do\n',
          )
          PY
      - name: Check Python syntax
        run: |
          python -B -c "from pathlib import Path; files=list(Path('app').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print('syntax ok', len(files), 'files')"
      - name: Run Single Edge contract tests
        run: |
          python -m pytest -q tests/test_2301_single_edge_all_protocol_443.py tests/test_2301_single_edge_tls_hub.py tests/test_2301_udp_edge_classifier.py
      - name: Refresh source checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          tracked = subprocess.check_output(['git','ls-files','--cached','--others','--exclude-standard'], text=True).splitlines()
          paths = sorted(path for path in tracked if path != 'SOURCE-SHA256SUMS' and not path.startswith('.github/workflows/'))
          body = ''.join(f'{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}\n' for path in paths)
          Path('SOURCE-SHA256SUMS').write_text(body, encoding='utf-8', newline='\n')
          PY
      - name: Commit verified fix
        run: |
          git add app/clients/exports.py app/maintenance/awg31_stage3a_data.py install.sh SOURCE-SHA256SUMS
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: finish private UDP edge lifecycle"
          git push origin HEAD:feat/2301-single-edge-443
