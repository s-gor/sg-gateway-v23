name: Refresh source sums

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'feat/2301-single-edge-443'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2301-single-edge-443
      - name: Refresh SOURCE-SHA256SUMS
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          rows = []
          for rel in tracked:
              if rel == 'SOURCE-SHA256SUMS' or rel.startswith('.github/workflows/'):
                  continue
              rows.append(f"{hashlib.sha256(Path(rel).read_bytes()).hexdigest()}  {rel}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')
          PY
          git diff --check
      - name: Commit and push
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'sg-gateway-ci'
          git config user.email 'sg-gateway-ci@users.noreply.github.com'
          git add SOURCE-SHA256SUMS
          git commit -m 'chore: refresh source checksums'
          git push origin HEAD:feat/2301-single-edge-443
