name: Apply TCP Edge 443 Mieru AnyTLS fix

on:
  push:
    branches: [feat/2301-single-edge-443]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[tcp-edge-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2301-single-edge-443
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Confirm RED contract before production change
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_2301_single_edge_tls_hub.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'Expected TCP edge regression test to be RED before patch.' >&2
            exit 1
          fi
          echo "RED confirmed (pytest exit $rc)"

      - name: Patch clean-install and HTTPS TCP edge generators
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          install_constants_old = '''HYSTERIA2_PORT="10452"
          ANYTLS_PORT="10449"
          TUIC_PORT="10453"'''.replace('          ', '')
          install_constants_new = '''HYSTERIA2_PORT="10452"
          ANYTLS_PORT="10449"
          ANYTLS_ALPN="sg-anytls"
          TUIC_PORT="10453"'''.replace('          ', '')
          replace_once('install.sh', install_constants_old, install_constants_new)

          install_edge_old = r'''map \$ssl_preread_server_name \$sg_gateway_443_backend {
              hostnames;
              ${REALITY_SNI} 127.0.0.1:${REALITY_INTERNAL_PORT};
              ${SG_GATEWAY_XHTTP_REALITY_SNI} 127.0.0.1:${XHTTP_REALITY_PORT};
          ${SG_GATEWAY_TLS_EDGE_ROUTE}
              default 127.0.0.1:${REALITY_INTERNAL_PORT};
          }

          server {'''.replace('          ', '')
          install_edge_new = r'''map \$ssl_preread_server_name \$sg_gateway_sni_backend {
              hostnames;
              ${REALITY_SNI} 127.0.0.1:${REALITY_INTERNAL_PORT};
              ${SG_GATEWAY_XHTTP_REALITY_SNI} 127.0.0.1:${XHTTP_REALITY_PORT};
          ${SG_GATEWAY_TLS_EDGE_ROUTE}
              default 127.0.0.1:${REALITY_INTERNAL_PORT};
          }

          map \$ssl_preread_protocol \$sg_gateway_protocol_backend {
              "" 127.0.0.1:${MIHOMO_PORT};
              default \$sg_gateway_sni_backend;
          }

          map \$ssl_preread_alpn_protocols \$sg_gateway_443_backend {
              ~\b${ANYTLS_ALPN}\b 127.0.0.1:${ANYTLS_PORT};
              default \$sg_gateway_protocol_backend;
          }

          server {'''.replace('          ', '')
          replace_once('install.sh', install_edge_old, install_edge_new)

          access_constants_old = 'XRAY_INTERNAL_PORT="10443"; XHTTP_REALITY_INTERNAL_PORT="10444"; TLS_EDGE_INTERNAL_PORT="10447"; PLACEHOLDER_TLS_INTERNAL_PORT="7444"; PLACEHOLDER_HTTP_INTERNAL_PORT="10446"'
          access_constants_new = access_constants_old + '; MIERU_TCP_INTERNAL_PORT="10448"; ANYTLS_TCP_INTERNAL_PORT="10449"; ANYTLS_ALPN="sg-anytls"'
          replace_once('deploy/configure-panel-access.sh', access_constants_old, access_constants_new)

          access_edge_old = r'''map \$ssl_preread_server_name \$sg_gateway_443_backend {
              hostnames;
              $REALITY_SNI 127.0.0.1:$XRAY_INTERNAL_PORT;
              $XHTTP_REALITY_SNI 127.0.0.1:$XHTTP_REALITY_INTERNAL_PORT;
              $HOST 127.0.0.1:$TLS_EDGE_INTERNAL_PORT;
              default $default_backend;
          }
          server {'''.replace('          ', '')
          access_edge_new = r'''map \$ssl_preread_server_name \$sg_gateway_sni_backend {
              hostnames;
              $REALITY_SNI 127.0.0.1:$XRAY_INTERNAL_PORT;
              $XHTTP_REALITY_SNI 127.0.0.1:$XHTTP_REALITY_INTERNAL_PORT;
              $HOST 127.0.0.1:$TLS_EDGE_INTERNAL_PORT;
              default $default_backend;
          }
          map \$ssl_preread_protocol \$sg_gateway_protocol_backend {
              "" 127.0.0.1:$MIERU_TCP_INTERNAL_PORT;
              default \$sg_gateway_sni_backend;
          }
          map \$ssl_preread_alpn_protocols \$sg_gateway_443_backend {
              ~\b$ANYTLS_ALPN\b 127.0.0.1:$ANYTLS_TCP_INTERNAL_PORT;
              default \$sg_gateway_protocol_backend;
          }
          server {'''.replace('          ', '')
          replace_once('deploy/configure-panel-access.sh', access_edge_old, access_edge_new)
          PY

      - name: Verify targeted TCP edge contract and shell syntax
        run: |
          python -m pytest -q tests/test_2301_single_edge_tls_hub.py tests/test_sg_gateway_v23_single_edge_443.py tests/test_2301_single_edge_all_protocol_443.py
          bash -n install.sh
          bash -n deploy/configure-panel-access.sh

      - name: Refresh source integrity manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          tracked = sorted(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          expected = [p for p in tracked if p != 'SOURCE-SHA256SUMS' and not p.startswith('.github/workflows/')]
          lines = []
          for rel in expected:
              path = Path(rel)
              if not path.is_file():
                  raise SystemExit(f'missing tracked file: {rel}')
              lines.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {rel}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          print(f'refreshed {len(lines)} source hashes')
          PY

      - name: Commit verified production fix
        run: |
          git config user.name 'SG-Gateway CI'
          git config user.email 'actions@users.noreply.github.com'
          git add install.sh deploy/configure-panel-access.sh SOURCE-SHA256SUMS
          git diff --cached --check
          git commit -m 'fix: route Mieru and AnyTLS through TCP 443 edge [tcp-edge-applied]'
          git push origin HEAD:feat/2301-single-edge-443
