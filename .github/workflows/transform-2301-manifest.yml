name: Transform SG-Gateway 23.01 manifest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transform-2301-manifest.yml'

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          repository: s-gor/sg-gateway-v23
          ref: bootstrap/2301-source
          fetch-depth: 0

      - name: Rewrite 23.01 manifest identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('release-manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['version'] = '0.1.0-023.01'
          data['build'] = 'MAIN-02301-DEV'
          data['channel'] = 'dev-02301'
          data['status'] = 'DEVELOPMENT'
          data['rebuild_target'] = '0.1.0-023.01'
          data['next_development_line'] = '0.1.0-023.02'
          data['installer_update']['version'] = '02301-dev'
          panel = data['maintenance_updates']['panel']
          panel['channel'] = 'dev-02301'
          panel['source'] = 'github-dev-02301'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Install dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Verify focused 23.01 contracts
        run: |
          python3 -m pytest -q tests/test_2301_repository_identity.py
          python3 -m pytest -q tests/test_preview31_xray_updates.py
          python3 -m pytest -q tests/test_naiveproxy_xray_state_forwarding_2301.py

      - name: Commit 23.01 manifest identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sg-gateway-v23-bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add release-manifest.json
          git commit -m 'chore: reset release manifest identity to 23.01'
          git push origin HEAD:bootstrap/2301-source
