name: Single Edge 443 Dev

on:
  push:
    branches: [feat/2301-single-edge-443]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  single-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Single Edge contract
        run: python -m pytest -q tests/test_sg_gateway_v23_single_edge_443.py
