name: Align Single Edge regression contracts

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2301-single-edge-443
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Fix AWG31 HostD backend and align stale regression contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, got {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          # Real production defect: HostD AWG31 renderer still owned public UDP 443.
          replace_once(
              'hostd/sg_hostd/awg31_runtime.py',
              'from app.db import connect, init_db\n',
              'from app.db import connect, init_db\nfrom app.single_edge import AWG31_UDP_INTERNAL_PORT\n',
          )
          replace_once(
              'hostd/sg_hostd/awg31_runtime.py',
              '            "ListenPort = 443",\n',
              '            f"ListenPort = {AWG31_UDP_INTERNAL_PORT}",\n',
          )

          # New authoritative contract must cover both bootstrap and normal HostD renderers.
          replace_once(
              'tests/test_2301_single_edge_all_protocol_443.py',
              '''def test_awg31_server_runtime_binds_private_udp_backend_only():\n    data = (ROOT / "app/maintenance/awg31_stage3a_data.py").read_text(encoding="utf-8")\n    assert "AWG31_UDP_INTERNAL_PORT" in data\n    assert 'f"ListenPort = {AWG31_UDP_INTERNAL_PORT}"' in data\n    assert '"ListenPort = 443"' not in data\n''',
              '''def test_awg31_server_runtime_binds_private_udp_backend_only():\n    data = (ROOT / "app/maintenance/awg31_stage3a_data.py").read_text(encoding="utf-8")\n    runtime = (ROOT / "hostd/sg_hostd/awg31_runtime.py").read_text(encoding="utf-8")\n    for source in (data, runtime):\n        assert "AWG31_UDP_INTERNAL_PORT" in source\n        assert 'f"ListenPort = {AWG31_UDP_INTERNAL_PORT}"' in source\n        assert '"ListenPort = 443"' not in source\n''',
          )

          # Mieru is now deliberately TCP-only on Single Edge; the transport selector is no longer a user control.
          replace_once(
              'tests/test_connections_layout_v24.py',
              '''    for field in (\n        'name="mieru_enabled"', 'name="mieru_transport"',\n        'name="anytls_enabled"', 'name="tuic_enabled"',\n    ):\n        assert field in panel\n''',
              '''    for field in (\n        'name="mieru_enabled"', 'name="anytls_enabled"', 'name="tuic_enabled"',\n    ):\n        assert field in panel\n    assert 'name="mieru_transport"' not in panel\n''',
          )
          replace_once(
              'tests/test_sg_gateway_v22_mihomo_panel_cleanup_ui.py',
              '''    for control in (\n        'name="mieru_transport"',\n        'name="mieru_multiplexing"',\n''',
              '''    assert 'name="mieru_transport"' not in source\n\n    for control in (\n        'name="mieru_multiplexing"',\n''',
          )
          replace_once(
              'tests/test_sg_gateway_v22_server_managed_ports.py',
              '''    assert saved["port"] == 12099\n    assert saved["config"]["mieru_port"] == 12099\n    assert saved["config"]["anytls_port"] == 18443\n    assert saved["config"]["tuic_port"] == 20443\n''',
              '''    assert saved["port"] == 443\n    assert saved["config"]["mieru_port"] == 443\n    assert saved["config"]["anytls_port"] == 443\n    assert saved["config"]["tuic_port"] == 443\n    assert saved["config"]["mieru_transport"] == "TCP"\n''',
          )
          replace_once(
              'tests/test_sg_gateway_v22_server_managed_ports.py',
              '''    assert 'name="hysteria2_obfs_mode"' in template\n    assert 'name="mieru_transport"' in mihomo\n    assert 'name="tuic_congestion_controller"' in mihomo\n''',
              '''    assert 'name="hysteria2_obfs_mode"' in template\n    assert 'name="mieru_transport"' not in mihomo\n    assert 'name="tuic_congestion_controller"' in mihomo\n''',
          )
          replace_once(
              'tests/test_sg_gateway_v22_ui_function_contract_02208.py',
              '                "mieru_handshake", "mieru_multiplexing", "mieru_transport",\n',
              '                "mieru_handshake", "mieru_multiplexing",\n',
          )

          # Hysteria2/TUIC/AnyTLS clients advertise public 443; their daemon listeners stay private.
          replace_once(
              'tests/test_hysteria2_salamander_v016.py',
              '    assert parsed.port == 8446\n',
              '    assert parsed.port == 443\n',
          )
          replace_once(
              'tests/test_ipv6_dual_stack.py',
              '    assert "endpoint = format_host_port(host, profile.port)" in text\n',
              '    assert "endpoint = format_host_port(host, public_profile_port)" in text\n',
          )
          replace_once(
              'tests/test_ipv6_dual_stack.py',
              '    assert \'endpoint = format_host_port(host, int(config.get("port", 9443)))\' in text\n',
              '    assert "endpoint = format_host_port(host, PUBLIC_TCP_PORT)" in text\n',
          )
          replace_once(
              'tests/test_ipv6_dual_stack.py',
              '    assert \'endpoint = format_host_port(host, int(config.get("port", 10443)))\' in text\n',
              '    assert "endpoint = format_host_port(host, PUBLIC_UDP_PORT)" in text\n',
          )
          replace_once(
              'tests/test_sg_gateway_0212_split_apply_and_salamander_status.py',
              '    assert by_type["anytls"]["listen_port"] == 9443\n    assert by_type["tuic"]["listen_port"] == 10443\n',
              '    assert by_type["anytls"]["listen_port"] == 10449\n    assert by_type["tuic"]["listen_port"] == 10453\n',
          )
          replace_once(
              'tests/test_sg_gateway_021_hysteria2_startup_wait.py',
              '    assert "while not _udp_port_listening(hysteria_profile.port):" in text\n',
              '    assert "while not _udp_port_listening(HYSTERIA2_UDP_INTERNAL_PORT):" in text\n',
          )
          replace_once(
              'tests/test_sg_gateway_v22_awg31_stage3a_install_update.py',
              '    assert "ListenPort = 443" in server\n',
              '    assert "ListenPort = 10451" in server\n',
          )

          # Older 23.01 tests described the previous dedicated-UDP design. Keep their intent, update the topology.
          replace_once(
              'tests/test_sg_gateway_v23_single_edge_443.py',
              '    assert values["hysteria2_port"] == 8446\n',
              '    assert values["hysteria2_port"] == 443\n',
          )
          replace_once(
              'tests/test_sg_gateway_v23_single_edge_443.py',
              '    assert exports.count("from app.single_edge import PUBLIC_TCP_PORT, XHTTP_REALITY_DEFAULT_SNI") == 1\n',
              '    assert "PUBLIC_TCP_PORT" in exports\n    assert "XHTTP_REALITY_DEFAULT_SNI" in exports\n',
          )
          replace_once(
              'tests/test_sg_gateway_v23_single_edge_443.py',
              '    assert \'"${XRAY_PORT}/tcp" "${XRAY_PORT}/udp"\' in text\n',
              '    assert \'"${PANEL_PORT}/tcp" "443/tcp" "443/udp"\' in text\n',
          )
          replace_once(
              'tests/test_sg_gateway_v23_single_edge_443.py',
              '''    assert 'ListenPort = 443' in runtime\n    assert 'ListenPort = 443' in stage3a_data\n    assert "port = 443" in stage3a_data\n''',
              '''    assert 'AWG31_UDP_INTERNAL_PORT' in runtime\n    assert 'f"ListenPort = {AWG31_UDP_INTERNAL_PORT}"' in runtime\n    assert 'AWG31_UDP_INTERNAL_PORT' in stage3a_data\n    assert 'f"ListenPort = {AWG31_UDP_INTERNAL_PORT}"' in stage3a_data\n    assert "port = 443" in stage3a_data\n''',
          )
          PY
      - name: Refresh source checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          tracked = subprocess.check_output(['git','ls-files','--cached','--others','--exclude-standard'], text=True).splitlines()
          paths = sorted(path for path in tracked if path != 'SOURCE-SHA256SUMS' and not path.startswith('.github/workflows/'))
          body = ''.join(f'{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}\n' for path in paths)
          Path('SOURCE-SHA256SUMS').write_text(body, encoding='utf-8', newline='\n')
          PY
      - name: Syntax and focused regression suite
        run: |
          python -B -c "from pathlib import Path; files=list(Path('app').rglob('*.py'))+list(Path('engines').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print('syntax ok', len(files), 'files')"
          python -m pytest -q \
            tests/test_2301_single_edge_all_protocol_443.py \
            tests/test_2301_udp_edge_classifier.py \
            tests/test_connections_layout_v24.py \
            tests/test_hysteria2_salamander_v016.py \
            tests/test_ipv6_dual_stack.py \
            tests/test_sg_gateway_0212_split_apply_and_salamander_status.py \
            tests/test_sg_gateway_021_hysteria2_startup_wait.py \
            tests/test_sg_gateway_v22_awg31_stage3a_install_update.py \
            tests/test_sg_gateway_v22_mihomo_panel_cleanup_ui.py \
            tests/test_sg_gateway_v22_server_managed_ports.py \
            tests/test_sg_gateway_v22_ui_function_contract_02208.py \
            tests/test_sg_gateway_v23_single_edge_443.py
      - name: Run full suite
        run: python -m pytest -q tests
      - name: Commit verified alignment
        run: |
          git add hostd/sg_hostd/awg31_runtime.py tests SOURCE-SHA256SUMS
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete single-edge UDP backend contract"
          git push origin HEAD:feat/2301-single-edge-443
