name: Repair Single Edge finalizer
on:
  push:
    branches: [feat/2301-single-edge-443]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Repair generated test quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/single-edge-finalize3.yml')
          s=p.read_text(encoding='utf-8')
          old='assert "PANEL_HTTP_INTERNAL_PORT=\\"10446\\"" in access'
          new="assert 'PANEL_HTTP_INTERNAL_PORT=\"10446\"' in access"
          if old not in s:
              raise SystemExit('target assertion not found')
          p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')
          PY
      - name: Commit repair and remove helper
        run: |
          git config user.name 'SG-Gateway CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-finalizer.yml
          git add .github/workflows/single-edge-finalize3.yml
          git commit -m 'ci: fix Single Edge finalizer quoting'
          git push origin HEAD:feat/2301-single-edge-443
