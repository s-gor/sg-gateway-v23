name: Target AnyTLS regression

on:
  push:
    branches: [feat/2301-single-edge-443]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_subscription_anytls_naive_regression.py
