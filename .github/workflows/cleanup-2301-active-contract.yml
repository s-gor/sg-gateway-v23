name: Cleanup SG-Gateway 23.01 active contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-2301-active-contract.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          repository: s-gor/sg-gateway-v23
          ref: bootstrap/2301-source
          fetch-depth: 0

      - name: Preserve readiness tests and retire 02206 guard contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          old = Path('tests/test_sg_gateway_v22_02206_installer_readiness.py')
          text = old.read_text(encoding='utf-8')
          text = re.sub(r'^WORKFLOW = .*\n', '', text, flags=re.MULTILINE)
          text = re.sub(
              r'\n\ndef test_guard_runs_02206_startup_regressions_explicitly\(\) -> None:\n.*\Z',
              '\n',
              text,
              flags=re.DOTALL,
          )
          new = Path('tests/test_2301_installer_readiness.py')
          new.write_text(text, encoding='utf-8')
          old.unlink()

          manifest_path = Path('release-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['clients_ui']['awg_generations'] = ['AWG3.1']
          manifest['installer_update'].pop('awg2_runtime_line', None)
          manifest['installer_update'].pop('awg3_runtime_line', None)
          manifest.get('client_access_model', {}).pop('awg2_awg3_independent_selection', None)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Install dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Verify converted 23.01 contracts
        run: |
          python3 -m pytest -q tests/test_2301_installer_readiness.py
          python3 -m pytest -q tests/test_2301_active_protocol_contract.py
          python3 -m pytest -q tests/test_preview31_xray_updates.py tests/test_naiveproxy_xray_state_forwarding_2301.py

      - name: Commit active-contract cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sg-gateway-v23-bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add release-manifest.json tests/test_2301_installer_readiness.py tests/test_sg_gateway_v22_02206_installer_readiness.py
          git commit -m 'test: reset active 23.01 protocol and readiness contract'
          git push origin HEAD:bootstrap/2301-source
