name: Restore verified Xray profiles

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact verified Xray profiles blob
        shell: bash
        run: |
          git show 8b2a13a59abe72693f4586f53f6b2b531644b4d3:app/xray/profiles.py > app/xray/profiles.py
          test "$(git hash-object app/xray/profiles.py)" = "f014dc65747f242218710b3880247e62eaeabc7d"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify critical imports and focused regressions
        shell: bash
        run: |
          python -c "from app.xray.profiles import new_salamander_password, overview"
          python -m pytest -q tests/test_preview31_xray_updates.py tests/test_xray_profile_flow_v23.py tests/test_preview54_sgpanel_vless_port.py tests/test_sg_gateway_v23_single_edge_443.py
      - name: Regenerate SOURCE-SHA256SUMS
        shell: bash
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import subprocess
          tracked=sorted(subprocess.check_output(['git','ls-files'], text=True).splitlines())
          paths=[p for p in tracked if p!='SOURCE-SHA256SUMS' and not p.startswith('.github/workflows/')]
          rows=[]
          for rel in paths:
              fp=Path(rel)
              if not fp.is_file(): raise SystemExit(f'missing tracked source file: {rel}')
              rows.append(f'{sha256(fp.read_bytes()).hexdigest()}  {rel}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY
      - name: Commit exact restore
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/xray/profiles.py SOURCE-SHA256SUMS
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore exact verified Xray profiles blob"
          git pull --rebase origin feat/2301-single-edge-443
          git push origin HEAD:feat/2301-single-edge-443
