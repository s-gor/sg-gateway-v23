name: Finalize AWG31 UDP Namespace Isolation

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Remove temporary workflow
        run: rm -f .github/workflows/awg31-netns-finalize.yml
      - name: Patch updater AWG31 reload ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('deploy/update-from-github-core.sh')
          text = path.read_text(encoding='utf-8')
          old = '  systemctl daemon-reload\n  systemctl enable --now "$UDP_EDGE_SERVICE"\n'
          new = (
              '  systemctl daemon-reload\n'
              '  if systemctl is-active --quiet "$AWG31_SERVICE"; then\n'
              '    systemctl restart "$AWG31_SERVICE"\n'
              '    systemctl is-active --quiet "$AWG31_SERVICE" || \\\n'
              '      fail "AWG31 service failed to restart with private UDP backend"\n'
              '  fi\n'
              '  systemctl enable --now "$UDP_EDGE_SERVICE"\n'
          )
          if old not in text:
              raise SystemExit('updater patch anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          bash -n deploy/update-from-github-core.sh
          bash -n deploy/sg-gateway-awg31-userspace.sh
      - name: Rebuild source integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          files = sorted(
              rel for rel in tracked
              if rel != 'SOURCE-SHA256SUMS' and not rel.startswith('.github/workflows/')
          )
          rows = []
          for rel in files:
              data = Path(rel).read_bytes()
              rows.append(f"{hashlib.sha256(data).hexdigest()}  {rel}\n")
          Path('SOURCE-SHA256SUMS').write_text(''.join(rows), encoding='utf-8')
          print(f'source integrity rebuilt: {len(rows)} files')
          PY
      - name: Verify targeted contracts
        run: |
          python -m pytest -q tests/test_2301_single_edge_all_protocol_443.py tests/test_2301_udp_edge_update_rollout.py
      - name: Verify full suite
        run: python -m pytest -q tests
      - name: Commit verified production fix
        run: |
          git config user.name 'SG-Gateway CI'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy/update-from-github-core.sh SOURCE-SHA256SUMS
          git add -u .github/workflows/awg31-netns-finalize.yml
          git diff --cached --check
          git commit -m 'fix: reload AWG31 into private UDP namespace'
          git push origin HEAD:feat/2301-single-edge-443
