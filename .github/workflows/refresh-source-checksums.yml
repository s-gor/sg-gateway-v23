name: Refresh source checksums

on:
  push:
    branches: [feat/2301-single-edge-443]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate SOURCE-SHA256SUMS
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          paths = [
              rel for rel in tracked
              if rel != 'SOURCE-SHA256SUMS' and not rel.startswith('.github/workflows/')
          ]
          rows = [f"{hashlib.sha256(Path(rel).read_bytes()).hexdigest()}  {rel}" for rel in paths]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          if git diff --quiet -- SOURCE-SHA256SUMS; then
            exit 0
          fi
          git config user.name "sg-gateway-ci"
          git config user.email "sg-gateway-ci@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git commit -m "chore: refresh source checksums"
          git push
