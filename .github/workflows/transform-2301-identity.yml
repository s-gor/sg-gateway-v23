name: Transform SG-Gateway 23.01 identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transform-2301-identity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          repository: s-gor/sg-gateway-v23
          ref: bootstrap/2301-source
          fetch-depth: 0

      - name: Rewrite active repository identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('README.md'),
              Path('deploy/GITHUB-COMMANDS.md'),
              Path('deploy/install-from-github.sh'),
              Path('deploy/update-from-github.sh'),
              Path('deploy/update-from-github-core.sh'),
              Path('deploy/uninstall-from-github.sh'),
          ]
          replacements = [
              ('s-gor/sg-gateway-v22', 's-gor/sg-gateway-v23'),
              ('stable-02208', 'dev-02301'),
              ('sg-gateway-bootstrap-02208.log', 'sg-gateway-bootstrap-02301.log'),
              ('sg-gateway-stable-02208.tar.gz', 'sg-gateway-dev-02301.tar.gz'),
              ('STABLE channel: dev-02301', 'DEV channel: dev-02301'),
              ('stable installer is pinned to dev-02301', 'development installer is pinned to dev-02301'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          test = Path('tests/test_2301_repository_identity.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_2301_version_identity():\n    assert Path("VERSION").read_text().strip() == "0.1.0-023.01"\n    assert Path("DEVELOPMENT-VERSION").read_text().strip() == "0.1.0-023.01-dev"\n    assert Path("BUILD-ID").read_text().strip() == "MAIN-02301-DEV"\n\n\ndef test_active_commands_use_v23_only():\n    paths = [\n        Path("README.md"),\n        Path("deploy/GITHUB-COMMANDS.md"),\n        Path("deploy/install-from-github.sh"),\n        Path("deploy/update-from-github.sh"),\n        Path("deploy/update-from-github-core.sh"),\n        Path("deploy/uninstall-from-github.sh"),\n    ]\n    text = "\\n".join(p.read_text(encoding="utf-8") for p in paths)\n    assert "s-gor/sg-gateway-v23" in text\n    assert "s-gor/sg-gateway-v22" not in text\n    assert "stable-02208" not in text\n    assert "6d8b07125289566a6e8a7ba206094d8969e92125" not in text\n''', encoding='utf-8')
          PY

      - name: Verify identity contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_2301_repository_identity.py

      - name: Commit v23 identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sg-gateway-v23-bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md deploy tests/test_2301_repository_identity.py
          git commit -m 'chore: reset active repository identity to 23.01'
          git push origin HEAD:bootstrap/2301-source
