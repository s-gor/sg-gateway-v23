name: Fix Nginx Refresh Self-Heal

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Apply TDD patch
        run: python tools/_tmp_fix_nginx_refresh_selfheal.py
      - name: Verify targeted contracts
        run: |
          python -m pytest -q tests/test_2301_single_edge_tls_hub.py tests/test_2301_single_edge_all_protocol_443.py tests/test_2301_udp_edge_update_rollout.py
      - name: Verify full suite
        run: python -m pytest -q tests
      - name: Commit verified production fix
        run: |
          git config user.name 'SG-Gateway CI'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy/configure-panel-access.sh deploy/update-from-github-core.sh tests/test_2301_single_edge_tls_hub.py SOURCE-SHA256SUMS
          git add -u .github/workflows/fix-nginx-refresh-selfheal.yml tools/_tmp_fix_nginx_refresh_selfheal.py
          git diff --cached --check
          git commit -m 'fix: self-heal broken Single Edge nginx refresh'
          git push origin HEAD:feat/2301-single-edge-443
