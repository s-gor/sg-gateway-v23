name: Fix Inactive Nginx Recovery

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Apply production patch
        run: |
          python tools/_tmp_fix_inactive_nginx_recovery.py
          bash -n deploy/update-from-github-core.sh
          bash -n deploy/configure-panel-access.sh
      - name: Remove temporary verifier files and rebuild integrity
        run: |
          git rm -f .github/workflows/fix-inactive-nginx-recovery.yml tools/_tmp_fix_inactive_nginx_recovery.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          files = sorted(rel for rel in tracked if rel != 'SOURCE-SHA256SUMS' and not rel.startswith('.github/workflows/'))
          rows = []
          for rel in files:
              path = Path(rel)
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {rel}\n")
          Path('SOURCE-SHA256SUMS').write_text(''.join(rows), encoding='utf-8')
          print(f'source integrity rebuilt: {len(rows)} files')
          PY
      - name: Verify targeted recovery contracts
        run: |
          python -m pytest -q tests/test_2301_single_edge_all_protocol_443.py tests/test_2301_single_edge_tls_hub.py tests/test_2301_udp_edge_update_rollout.py
      - name: Verify full suite
        run: python -m pytest -q tests
      - name: Commit verified production fix
        run: |
          git config user.name 'SG-Gateway CI'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy/update-from-github-core.sh deploy/configure-panel-access.sh tests/test_2301_single_edge_all_protocol_443.py SOURCE-SHA256SUMS
          git diff --cached --check
          git commit -m 'fix: recover inactive nginx during safe update'
          git push origin HEAD:feat/2301-single-edge-443
