name: Finalize Mihomo compatible vendor

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh vendor manifest for changed notices
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          vendor = Path("vendor/cores")
          manifest = vendor / "SHA256SUMS"
          rows = manifest.read_text(encoding="utf-8").splitlines()
          notice = vendor / "THIRD-PARTY-NOTICES.md"
          notice_sha = hashlib.sha256(notice.read_bytes()).hexdigest()
          replaced = 0
          updated = []
          for row in rows:
              if row.endswith("  THIRD-PARTY-NOTICES.md"):
                  updated.append(f"{notice_sha}  THIRD-PARTY-NOTICES.md")
                  replaced += 1
              else:
                  updated.append(row)
          if replaced != 1:
              raise SystemExit(f"expected one THIRD-PARTY-NOTICES manifest row, got {replaced}")
          manifest.write_text("\n".join(updated) + "\n", encoding="utf-8")
          PY
          (
            cd vendor/cores
            sha256sum -c SHA256SUMS
          )
          test -f vendor/cores/mihomo-linux-amd64-compatible-v1.19.29.gz
          test ! -e vendor/cores/mihomo-linux-amd64-v1.19.29.gz
      - name: Refresh source integrity
        run: |
          set -Eeuo pipefail
          git add vendor/cores/SHA256SUMS
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          expected = sorted(
              rel for rel in tracked
              if rel != "SOURCE-SHA256SUMS" and not rel.startswith(".github/workflows/")
          )
          rows = []
          for rel in expected:
              path = Path(rel)
              if not path.is_file():
                  raise SystemExit(f"tracked source file missing while refreshing checksums: {rel}")
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {rel}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          git add SOURCE-SHA256SUMS
      - name: Verify regression and manifests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_2301_mihomo_compatible_vendor.py tests/test_sg_gateway_021_vendored_five_engines.py
          git diff --cached --check
      - name: Commit finalized vendor manifest
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: finalize compatible Mihomo vendor manifest'
          git push origin "HEAD:${GITHUB_REF_NAME}"
