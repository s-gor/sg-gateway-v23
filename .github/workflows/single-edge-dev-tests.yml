name: Single Edge 443 development tests

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: read

jobs:
  targeted:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2301-single-edge-443
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax
        run: python -B -c "from pathlib import Path; files=list(Path('app').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print(f'syntax ok: {len(files)} files')"
      - name: Single-edge focused tests
        run: |
          python -m pytest -q \
            tests/test_2301_single_edge_tls_hub.py \
            tests/test_2301_single_edge_all_protocol_443.py
