name: Refresh source checksums (single-edge development)

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2301-single-edge-443
          fetch-depth: 0
      - name: Refresh SOURCE-SHA256SUMS
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          paths = sorted(
              path for path in tracked
              if path != 'SOURCE-SHA256SUMS'
              and not path.startswith('.github/workflows/')
          )
          body = ''.join(
              f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}\n"
              for path in paths
          )
          Path('SOURCE-SHA256SUMS').write_text(body, encoding='utf-8', newline='\n')
          PY
      - name: Commit refreshed manifest
        run: |
          git add SOURCE-SHA256SUMS
          if git diff --cached --quiet; then
            echo "SOURCE-SHA256SUMS already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh source checksums"
          git push origin HEAD:feat/2301-single-edge-443
