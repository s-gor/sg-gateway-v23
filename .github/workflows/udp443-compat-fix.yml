name: Apply UDP443 Compatibility Fix

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2301-single-edge-443
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Confirm RED contract
        run: |
          set +e
          python -m pytest -q tests/test_2301_single_edge_all_protocol_443.py
          rc=$?
          set -e
          test "$rc" -ne 0
      - name: Apply production patch
        run: python tools/apply_udp443_compat_patch.py
      - name: Remove temporary helpers
        run: git rm tools/apply_udp443_compat_patch.py .github/workflows/udp443-compat-fix.yml
      - name: Refresh source integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          tracked = sorted(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          expected = [p for p in tracked if p != 'SOURCE-SHA256SUMS' and not p.startswith('.github/workflows/')]
          lines = [f'{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}' for p in expected]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Verify targeted compatibility
        run: |
          python -m pytest -q tests/test_2301_single_edge_all_protocol_443.py tests/test_2301_udp_edge_classifier.py tests/test_sg_gateway_v23_single_edge_443.py
          bash -n deploy/update-from-github-core.sh
      - name: Run full test suite
        run: python -m pytest -q tests
      - name: Commit production fix
        run: |
          git config user.name 'SG-Gateway CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: make Hysteria2 and TUIC deterministic on UDP 443 [udp443-compat-applied]'
          git push origin HEAD:feat/2301-single-edge-443
