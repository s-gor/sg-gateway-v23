name: Apply UDP443 Compatibility Fix

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2301-single-edge-443
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium for geometry tests
        run: python -m playwright install chromium
      - name: Confirm RED contract
        run: |
          set +e
          python -m pytest -q tests/test_2301_single_edge_all_protocol_443.py
          rc=$?
          set -e
          test "$rc" -ne 0
      - name: Patch Xray prepare and trim helper
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/xray/profiles.py')
          s = p.read_text(encoding='utf-8')
          marker = '        base_finalmask = ensure_base_has_no_salamander(current["hysteria2_finalmask"])'
          replacement = (
              '        if values["hysteria2_enabled"] and requested_obfs == SALAMANDER_MODE_NONE:\n'
              '            requested_obfs = SALAMANDER_MODE\n'
              + marker
          )
          if s.count(marker) != 1:
              raise SystemExit(f'app/xray/profiles.py stable marker count={s.count(marker)}')
          p.write_text(s.replace(marker, replacement, 1), encoding='utf-8', newline='\n')

          q = Path('tools/apply_udp443_compat_patch.py')
          body = q.read_text(encoding='utf-8')
          start = body.index('profiles_old =')
          helper_marker = 'replace_once("app/xray/profiles.py", profiles_old, profiles_new)'
          finish = body.index(helper_marker, start) + len(helper_marker)
          while finish < len(body) and body[finish] in '\r\n':
              finish += 1
          q.write_text(body[:start] + body[finish:], encoding='utf-8', newline='\n')
          PY
      - name: Apply remaining production patch
        run: python tools/apply_udp443_compat_patch.py
      - name: Preserve legacy servers without Xray
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/maintenance/udp443_compat.py')
          s = p.read_text(encoding='utf-8')
          old = 'def migrate() -> dict[str, Any]:\n    settings = get_connection_settings("xray")\n    candidate, changed = normalise_hysteria2_config(dict(settings.config))'
          new = 'def migrate() -> dict[str, Any]:\n    try:\n        settings = get_connection_settings("xray")\n    except KeyError:\n        return {"changed": False, "mode": "absent"}\n    candidate, changed = normalise_hysteria2_config(dict(settings.config))'
          if s.count(old) != 1:
              raise SystemExit(f'app/maintenance/udp443_compat.py legacy-Xray anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Remove temporary helpers
        run: git rm -f tools/apply_udp443_compat_patch.py .github/workflows/udp443-compat-fix.yml
      - name: Refresh source integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          tracked = sorted(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          expected = [p for p in tracked if p != 'SOURCE-SHA256SUMS' and not p.startswith('.github/workflows/')]
          lines = [f'{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}' for p in expected]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Create local candidate commit
        run: |
          git config user.name 'SG-Gateway CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: make Hysteria2 and TUIC deterministic on UDP 443 [udp443-compat-applied]'
      - name: Verify targeted compatibility
        run: |
          python -m pytest -q tests/test_2301_single_edge_all_protocol_443.py tests/test_2301_udp_edge_classifier.py tests/test_sg_gateway_v23_single_edge_443.py tests/test_sg_gateway_v22_awg31_update_transaction.py
          bash -n deploy/update-from-github-core.sh
      - name: Run full test suite
        run: python -m pytest -q tests
      - name: Push verified production fix
        run: git push origin HEAD:feat/2301-single-edge-443
