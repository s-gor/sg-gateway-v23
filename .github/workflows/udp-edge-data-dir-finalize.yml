name: Finalize UDP Edge Data Dir Fix

on:
  push:
    branches: [feat/2301-single-edge-443]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2301-single-edge-443
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Remove temporary workflow
        run: git rm -f .github/workflows/udp-edge-data-dir-finalize.yml
      - name: Rebuild source integrity from committed blobs
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          paths = [p for p in tracked if p != 'SOURCE-SHA256SUMS' and not p.startswith('.github/workflows/')]
          rows = []
          for path in sorted(paths):
              data = subprocess.check_output(['git', 'show', f'HEAD:{path}'])
              rows.append(f'{hashlib.sha256(data).hexdigest()}  {path}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
      - name: Verify UDP edge regression
        run: python -m pytest -q tests/test_2301_udp_edge_update_rollout.py tests/test_2301_single_edge_all_protocol_443.py
      - name: Commit and push checksum-finalized fix
        run: |
          git config user.name 'SG-Gateway CI'
          git config user.email 'actions@users.noreply.github.com'
          git add SOURCE-SHA256SUMS
          git commit -m 'fix: finalize UDP edge persistent data access'
          git push origin HEAD:feat/2301-single-edge-443
