name: Repair final Xray cache line

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair service cache assignment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/xray/profiles.py')
          text = p.read_text(encoding='utf-8')
          old = '_XRAY_VERSION_PROBE_CACHE["updated_at"] = now\n    _XRAY_SERVICE_PROBE_CACHE["value"] = value\n    return value\n\n\ndef _config()'
          new = '_XRAY_SERVICE_PROBE_CACHE["updated_at"] = now\n    _XRAY_SERVICE_PROBE_CACHE["value"] = value\n    return value\n\n\ndef _config()'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale service-cache assignment, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify Xray profile contract
        run: python -m pytest -q tests/test_xray_profile_flow_v23.py tests/test_preview54_sgpanel_vless_port.py tests/test_sg_gateway_v23_single_edge_443.py
      - name: Regenerate SOURCE-SHA256SUMS
        shell: bash
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import subprocess
          tracked = sorted(subprocess.check_output(['git','ls-files'], text=True).splitlines())
          paths = [p for p in tracked if p != 'SOURCE-SHA256SUMS' and not p.startswith('.github/workflows/')]
          rows=[]
          for rel in paths:
              fp=Path(rel)
              if not fp.is_file(): raise SystemExit(f'missing tracked source file: {rel}')
              rows.append(f'{sha256(fp.read_bytes()).hexdigest()}  {rel}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/xray/profiles.py SOURCE-SHA256SUMS
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore Xray service probe cache contract"
          git pull --rebase origin feat/2301-single-edge-443
          git push origin HEAD:feat/2301-single-edge-443
