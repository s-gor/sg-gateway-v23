name: Refresh Single Edge source sums

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify Xray profile contract
        run: python -m pytest -q tests/test_xray_profile_flow_v23.py tests/test_preview54_sgpanel_vless_port.py tests/test_sg_gateway_v23_single_edge_443.py
      - name: Regenerate SOURCE-SHA256SUMS
        shell: bash
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import subprocess
          tracked = sorted(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          paths = [p for p in tracked if p != 'SOURCE-SHA256SUMS' and not p.startswith('.github/workflows/')]
          rows = []
          for rel in paths:
              fp = Path(rel)
              if not fp.is_file():
                  raise SystemExit(f'missing tracked source file: {rel}')
              rows.append(f'{sha256(fp.read_bytes()).hexdigest()}  {rel}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
      - name: Commit refreshed source sums
        shell: bash
        run: |
          if git diff --quiet -- SOURCE-SHA256SUMS; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git commit -m "chore: refresh source integrity after final cleanup"
          git pull --rebase origin feat/2301-single-edge-443
          git push origin HEAD:feat/2301-single-edge-443
