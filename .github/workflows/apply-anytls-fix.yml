name: Apply AnyTLS subscription fix

on:
  push:
    branches: [feat/2301-single-edge-443]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve full AnyTLS transport query
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/clients/sg_subscription.py')
          text = path.read_text(encoding='utf-8')
          old = '("sni", "alpn", "insecure")\n        if profile_id == "anytls"'
          new = '("security", "sni", "alpn", "fp", "type", "insecure")\n        if profile_id == "anytls"'
          if old not in text:
              raise SystemExit('expected AnyTLS canonical tuple not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "sg-gateway-ci"
          git config user.email "sg-gateway-ci@users.noreply.github.com"
          git add app/clients/sg_subscription.py
          git commit -m "fix: preserve AnyTLS TLS transport in SG subscription"
          git push
