name: Temporary source integrity refresh

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'fix/2301-public-install-identity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Refresh SOURCE-SHA256SUMS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess

          tracked = sorted(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          tracked = [
              rel for rel in tracked
              if rel != 'SOURCE-SHA256SUMS' and not rel.startswith('.github/workflows/')
          ]
          with Path('SOURCE-SHA256SUMS').open('w', encoding='utf-8', newline='\n') as out:
              for rel in tracked:
                  out.write(f"{hashlib.sha256(Path(rel).read_bytes()).hexdigest()}  {rel}\n")
          PY

          git config user.name "sg-gateway-v23-integrity"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet; then
            git add SOURCE-SHA256SUMS
            git commit -m "build: refresh 23.01 source integrity"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
