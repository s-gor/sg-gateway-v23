name: Apply all-protocol Single Edge batch

on:
  push:
    branches: [feat/2301-single-edge-443]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2301-single-edge-443
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Apply runtime and export changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          def replace_all(path, old, new, expected_min=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count < expected_min:
                  raise SystemExit(f'{path}: expected >= {expected_min} occurrences, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          Path('app/single_edge.py').write_text('''from __future__ import annotations

# Stable client-facing edge. Internal ports are never exported.
PUBLIC_TCP_PORT = 443
PUBLIC_UDP_PORT = 443

# TCP private backends.
REALITY_TCP_INTERNAL_PORT = 10443
XHTTP_REALITY_INTERNAL_PORT = 10444
XHTTP_TLS_INTERNAL_PORT = 10445
NAIVEPROXY_INTERNAL_PORT = 10447
MIERU_TCP_INTERNAL_PORT = 10448
ANYTLS_TCP_INTERNAL_PORT = 10449

# UDP private backends behind sg-gateway-udp-edge.service.
AWG31_UDP_INTERNAL_PORT = 10451
HYSTERIA2_UDP_INTERNAL_PORT = 10452
TUIC_UDP_INTERNAL_PORT = 10453

# Compatibility alias: this is the public client port, not the Xray bind port.
AWG31_UDP_PORT = PUBLIC_UDP_PORT
HYSTERIA2_DEFAULT_PORT = PUBLIC_UDP_PORT

XHTTP_REALITY_DEFAULT_SNI = "www.cloudflare.com"
XHTTP_REALITY_DEFAULT_TARGET = "www.cloudflare.com:443"
ANYTLS_ALPN = "sg-anytls"
''', encoding='utf-8', newline='\n')

          # Xray/sing-box runtime: all protocol listeners become private.
          replace_once(
              'hostd/sg_hostd/client_runtime.py',
              'from app.single_edge import XHTTP_REALITY_DEFAULT_SNI, XHTTP_REALITY_DEFAULT_TARGET',
              'from app.single_edge import (\n    ANYTLS_ALPN,\n    ANYTLS_TCP_INTERNAL_PORT,\n    HYSTERIA2_UDP_INTERNAL_PORT,\n    PUBLIC_TCP_PORT,\n    PUBLIC_UDP_PORT,\n    TUIC_UDP_INTERNAL_PORT,\n    XHTTP_REALITY_DEFAULT_SNI,\n    XHTTP_REALITY_DEFAULT_TARGET,\n)'
          )
          replace_once(
              'hostd/sg_hostd/client_runtime.py',
              '"tag": "sg-hysteria2",\n                "listen": public_listen,\n                "port": profile.port,',
              '"tag": "sg-hysteria2",\n                "listen": "127.0.0.1",\n                "port": HYSTERIA2_UDP_INTERNAL_PORT,'
          )
          replace_once(
              'hostd/sg_hostd/client_runtime.py',
              'while not _udp_port_listening(hysteria_profile.port):',
              'while not _udp_port_listening(HYSTERIA2_UDP_INTERNAL_PORT):'
          )
          replace_once(
              'hostd/sg_hostd/client_runtime.py',
              'f"Hysteria2 UDP-порт {hysteria_profile.port} не слушается через 10 секунд после запуска Xray"',
              'f"Hysteria2 internal UDP-порт {HYSTERIA2_UDP_INTERNAL_PORT} не слушается через 10 секунд после запуска Xray"'
          )
          replace_once(
              'hostd/sg_hostd/client_runtime.py',
              'port = int(settings.get("anytls_port") or 9443)',
              'port = ANYTLS_TCP_INTERNAL_PORT'
          )
          replace_once(
              'hostd/sg_hostd/client_runtime.py',
              'port = int(settings.get("tuic_port") or 10443)',
              'port = TUIC_UDP_INTERNAL_PORT'
          )
          # These two literals belong to AnyTLS and TUIC in _apply_singbox.
          replace_all('hostd/sg_hostd/client_runtime.py', '"listen": "::",', '"listen": "127.0.0.1",', 2)
          replace_once(
              'hostd/sg_hostd/client_runtime.py',
              '"server_name": domain,\n                "certificate_path": cert,',
              '"server_name": domain,\n                "alpn": [ANYTLS_ALPN],\n                "certificate_path": cert,'
          )
          replace_once(
              'hostd/sg_hostd/client_runtime.py',
              'config["port"] = int(settings.get("anytls_port") or 9443)',
              'config["port"] = PUBLIC_TCP_PORT\n                    config["alpn"] = ANYTLS_ALPN'
          )
          replace_once(
              'hostd/sg_hostd/client_runtime.py',
              'config["port"] = int(settings.get("tuic_port") or 10443)',
              'config["port"] = PUBLIC_UDP_PORT'
          )

          # Public exports are always :443.
          replace_once(
              'app/clients/exports.py',
              'from app.single_edge import PUBLIC_TCP_PORT, XHTTP_REALITY_DEFAULT_SNI',
              'from app.single_edge import ANYTLS_ALPN, PUBLIC_TCP_PORT, PUBLIC_UDP_PORT, XHTTP_REALITY_DEFAULT_SNI'
          )
          replace_once(
              'app/clients/exports.py',
              'if profile_id in {"reality_tcp", "xhttp_reality", "xhttp_tls"}',
              'if profile_id in {"reality_tcp", "xhttp_reality", "xhttp_tls", "hysteria2"}'
          )
          replace_all('app/clients/exports.py', '_format_endpoint(endpoint_host, settings.port)', '_format_endpoint(endpoint_host, PUBLIC_UDP_PORT)', 2)
          replace_all('app/clients/exports.py', 'port = int(settings.config.get("mieru_port", settings.port or 2099))', 'port = PUBLIC_TCP_PORT', 2)
          replace_all('app/clients/exports.py', 'transport = str(settings.config.get("mieru_transport", "TCP")).upper()', 'transport = "TCP"', 1)
          replace_all('app/clients/exports.py', 'transport = str(settings.config.get("mieru_transport") or "TCP").upper()', 'transport = "TCP"', 1)
          replace_once('app/clients/exports.py', 'endpoint = format_host_port(host, int(config.get("port", 9443)))', 'endpoint = format_host_port(host, PUBLIC_TCP_PORT)')
          replace_once('app/clients/exports.py', 'endpoint = format_host_port(host, int(config.get("port", 10443)))', 'endpoint = format_host_port(host, PUBLIC_UDP_PORT)')
          # AnyTLS gets a deterministic ALPN so Nginx can route it before the shared HTTPS SNI.
          replace_once(
              'app/clients/exports.py',
              '"security": "tls",\n            "sni": tls_domain,',
              '"security": "tls",\n            "sni": tls_domain,\n            "alpn": ANYTLS_ALPN,'
          )

          # Mihomo Connection exposes only public 443; its Mieru backend is TCP-only/private.
          p = Path('app/mihomo/service.py')
          text = p.read_text(encoding='utf-8')
          anchor = 'from app.maintenance.operations import log_operation\n'
          if anchor not in text:
              raise SystemExit('mihomo import anchor missing')
          text = text.replace(anchor, anchor + 'from app.single_edge import ANYTLS_ALPN, ANYTLS_TCP_INTERNAL_PORT, MIERU_TCP_INTERNAL_PORT, PUBLIC_TCP_PORT, PUBLIC_UDP_PORT, TUIC_UDP_INTERNAL_PORT\n', 1)
          text = re.sub(r'"mieru_port": _int\(config\.get\("mieru_port"\), current\.port or 2099\),', '"mieru_port": PUBLIC_TCP_PORT,', text, count=1)
          text = re.sub(r'"mieru_transport": \(\n\s+"UDP"\n\s+if str\(form\.get\("mieru_transport", "TCP"\)\)\.upper\(\) == "UDP"\n\s+else "TCP"\n\s+\),', '"mieru_transport": "TCP",', text, count=1)
          text = re.sub(r'"anytls_port": _int\(config\.get\("anytls_port"\), 8443\),', '"anytls_port": PUBLIC_TCP_PORT,', text, count=1)
          text = re.sub(r'"tuic_port": _int\(config\.get\("tuic_port"\), 10443\),', '"tuic_port": PUBLIC_UDP_PORT,', text, count=1)
          text = re.sub(r'"mieru_port": _int\(config\.get\("mieru_port"\), settings\.port or 2099\),', '"mieru_port": PUBLIC_TCP_PORT,', text, count=1)
          text = re.sub(r'"mieru_transport": \(\n\s+"UDP"\n\s+if str\(config\.get\("mieru_transport", "TCP"\)\)\.upper\(\) == "UDP"\n\s+else "TCP"\n\s+\),', '"mieru_transport": "TCP",', text, count=1)
          text = re.sub(r'"anytls_port": _int\(config\.get\("anytls_port"\), 8443\),', '"anytls_port": PUBLIC_TCP_PORT,', text, count=1)
          text = re.sub(r'"tuic_port": _int\(config\.get\("tuic_port"\), 10443\),', '"tuic_port": PUBLIC_UDP_PORT,', text, count=1)
          # Remove old distinct-public-port validation; backends have dedicated constants now.
          text = re.sub(r'\n    ports: list\[tuple\[str, int\]\] = \[\].*?raise MihomoError\("Порты Mieru, AnyTLS и TUIC должны различаться"\)\n', '\n', text, count=1, flags=re.S)
          text = re.sub(r'\n    awg = get_connection_settings\("amneziawg"\).*?raise MihomoError\(\n                f"\{label\}: порт \{port\}/\{transport\} уже используется: \{conflict\}"\n            \)\n', '\n', text, count=1, flags=re.S)
          text = text.replace('f"    port: {settings[\'mieru_port\']}"', 'f"    port: {MIERU_TCP_INTERNAL_PORT}"', 1)
          text = text.replace('"    listen: 0.0.0.0",\n            f"    transport: {settings[\'mieru_transport\']}"', '"    listen: 127.0.0.1",\n            "    transport: TCP"', 1)
          # Keep dormant unified renderer correct too.
          text = text.replace('f"    port: {settings[\'anytls_port\']}"', 'f"    port: {ANYTLS_TCP_INTERNAL_PORT}"', 1)
          text = text.replace('f"    port: {settings[\'tuic_port\']}"', 'f"    port: {TUIC_UDP_INTERNAL_PORT}"', 1)
          text = text.replace('f"    sni: {_yaml_string(settings[\'domain\'])}",\n                    "    udp: true",', 'f"    sni: {_yaml_string(settings[\'domain\'])}",\n                    f"    alpn: [{_yaml_string(ANYTLS_ALPN)}]",\n                    "    udp: true",', 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          # Mieru UDP cannot be safely multiplexed with encrypted UDP protocols; Single Edge fixes it to TCP.
          p = Path('app/web/templates/_mihomo_panel.html')
          text = p.read_text(encoding='utf-8')
          text, n = re.subn(r'\n        <div class="mhv2-basic-fields one">.*?name="mieru_transport".*?</div>', '\n        <p class="mhv2-runtime-note">Single Edge: Mieru использует TCP/443.</p>', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'mieru transport UI replacement count={n}')
          p.write_text(text, encoding='utf-8', newline='\n')

          # Installer public/private port contract and transactional service ownership.
          p = Path('install.sh')
          text = p.read_text(encoding='utf-8')
          text = text.replace('MIHOMO_PORT="2099"', 'MIHOMO_PORT="10448"', 1)
          text = text.replace('HYSTERIA2_PORT="8446"', 'HYSTERIA2_PORT="10452"', 1)
          text = text.replace('ANYTLS_PORT="9443"', 'ANYTLS_PORT="10449"', 1)
          text = text.replace('TUIC_PORT="10443"', 'TUIC_PORT="10453"', 1)
          if 'UDP_EDGE_SERVICE="sg-gateway-udp-edge.service"' not in text:
              text = text.replace('PLACEHOLDER_TLS_INTERNAL_PORT="7444"', 'PLACEHOLDER_TLS_INTERNAL_PORT="7444"\nUDP_EDGE_SERVICE="sg-gateway-udp-edge.service"', 1)
          text = text.replace('  etc/systemd/system/sg-gateway-singbox.service\n', '  etc/systemd/system/sg-gateway-singbox.service\n  etc/systemd/system/sg-gateway-udp-edge.service\n', 1)
          text = text.replace('sg-gateway-singbox.service sg-gateway-naiveproxy.service \\', 'sg-gateway-singbox.service sg-gateway-naiveproxy.service sg-gateway-udp-edge.service \\')
          text = text.replace('sg-gateway-singbox.service sg-gateway-naiveproxy.service\n', 'sg-gateway-singbox.service sg-gateway-naiveproxy.service sg-gateway-udp-edge.service\n')
          # Firewall protocol plane: only shared 443 TCP+UDP remains public.
          text = re.sub(
              r'for rule in \\\n\s+"80/tcp" "\$\{XRAY_PORT\}/tcp" "\$\{XRAY_PORT\}/udp" \\\n\s+"\$\{HYSTERIA2_PORT\}/udp" \\\n\s+"\$\{MIHOMO_PORT\}/tcp" "\$\{ANYTLS_PORT\}/tcp" "\$\{TUIC_PORT\}/udp"; do',
              'for rule in \\\n      "80/tcp" "443/tcp" "443/udp"; do',
              text,
              count=1,
          )
          # Install the dispatcher unit whenever source is staged.
          marker = 'stage_firewall_and_network() {'
          if 'install_udp_edge_service() {' not in text:
              block = '''install_udp_edge_service() {
  install -m 0644 "$PREFIX/deploy/sg-gateway-udp-edge.service" /etc/systemd/system/sg-gateway-udp-edge.service
  systemctl daemon-reload
  systemctl enable sg-gateway-udp-edge.service
}

'''
              text = text.replace(marker, block + marker, 1)
          # Ensure the unit gets installed before firewall/service validation stage.
          text = text.replace('stage_firewall_and_network() {\n', 'stage_firewall_and_network() {\n  install_udp_edge_service\n', 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          Path('app/udp_edge').mkdir(parents=True, exist_ok=True)
          Path('app/udp_edge/__init__.py').write_text('''"""SG-Gateway public UDP/443 dispatcher."""\n''', encoding='utf-8')
          Path('app/udp_edge/classifier.py').write_text(r'''from __future__ import annotations

import base64
import hashlib
from dataclasses import dataclass
from typing import Literal

Protocol = Literal["awg31", "hysteria2", "tuic"]


@dataclass(frozen=True)
class EdgeClassifierConfig:
    awg_enabled: bool = False
    awg_header_key: bytes = b""
    awg_s1: int = 0
    awg_h1_low: int = 0
    awg_h1_high: int = 0
    awg_s4: int = 0
    awg_h4_low: int = 0
    awg_h4_high: int = 0
    awg_random_trailers: bool = False
    hysteria_enabled: bool = False
    hysteria_mode: str = "none"
    hysteria_password: bytes = b""
    tuic_enabled: bool = False


def _rotl32(value: int, shift: int) -> int:
    return ((value << shift) & 0xFFFFFFFF) | (value >> (32 - shift))


def _quarter(state: list[int], a: int, b: int, c: int, d: int) -> None:
    state[a] = (state[a] + state[b]) & 0xFFFFFFFF; state[d] ^= state[a]; state[d] = _rotl32(state[d], 16)
    state[c] = (state[c] + state[d]) & 0xFFFFFFFF; state[b] ^= state[c]; state[b] = _rotl32(state[b], 12)
    state[a] = (state[a] + state[b]) & 0xFFFFFFFF; state[d] ^= state[a]; state[d] = _rotl32(state[d], 8)
    state[c] = (state[c] + state[d]) & 0xFFFFFFFF; state[b] ^= state[c]; state[b] = _rotl32(state[b], 7)


def _chacha20_prefix(key: bytes, nonce: bytes) -> bytes:
    if len(key) != 32 or len(nonce) != 12:
        return b""
    constants = b"expand 32-byte k"
    words = [int.from_bytes(constants[i:i+4], "little") for i in range(0, 16, 4)]
    words += [int.from_bytes(key[i:i+4], "little") for i in range(0, 32, 4)]
    words += [0]
    words += [int.from_bytes(nonce[i:i+4], "little") for i in range(0, 12, 4)]
    work = words[:]
    for _ in range(10):
        _quarter(work, 0, 4, 8, 12); _quarter(work, 1, 5, 9, 13); _quarter(work, 2, 6, 10, 14); _quarter(work, 3, 7, 11, 15)
        _quarter(work, 0, 5, 10, 15); _quarter(work, 1, 6, 11, 12); _quarter(work, 2, 7, 8, 13); _quarter(work, 3, 4, 9, 14)
    block = b"".join(((work[i] + words[i]) & 0xFFFFFFFF).to_bytes(4, "little") for i in range(16))
    return block[:4]


def decode_header_key(value: str) -> bytes:
    raw = str(value or "").strip()
    if len(raw) == 64:
        try:
            return bytes.fromhex(raw)
        except ValueError:
            pass
    try:
        decoded = base64.b64decode(raw, validate=True)
    except (ValueError, TypeError):
        return b""
    return decoded if len(decoded) == 32 else b""


def parse_range(value: object) -> tuple[int, int]:
    text = str(value or "0").strip()
    left, sep, right = text.partition("-")
    try:
        low = int(left)
        high = int(right) if sep else low
    except ValueError:
        return (0, 0)
    return (low, high) if 0 <= low <= high <= 0xFFFFFFFF else (0, 0)


def _awg_header_matches(data: bytes, *, padding: int, low: int, high: int, minimum: int, exact: int | None = None, random_trailers: bool = False, key: bytes) -> bool:
    if padding < 12 or len(data) < padding + 4 or len(key) != 32:
        return False
    body_len = len(data) - padding
    if body_len < minimum:
        return False
    if exact is not None and not random_trailers and body_len != exact:
        return False
    stream = _chacha20_prefix(key, data[:12])
    if len(stream) != 4:
        return False
    header = bytes(a ^ b for a, b in zip(data[padding:padding+4], stream))
    value = int.from_bytes(header, "little")
    return low <= value <= high


def looks_like_awg31(data: bytes, config: EdgeClassifierConfig) -> bool:
    if not config.awg_enabled or len(config.awg_header_key) != 32:
        return False
    # Initiation is the normal first useful client packet. Transport is also
    # accepted so an established peer survives dispatcher session expiry.
    return _awg_header_matches(
        data, padding=config.awg_s1, low=config.awg_h1_low, high=config.awg_h1_high,
        minimum=148, exact=148, random_trailers=config.awg_random_trailers,
        key=config.awg_header_key,
    ) or _awg_header_matches(
        data, padding=config.awg_s4, low=config.awg_h4_low, high=config.awg_h4_high,
        minimum=16, exact=None, random_trailers=True, key=config.awg_header_key,
    )


def looks_like_quic_long_header(data: bytes) -> bool:
    if len(data) < 7 or (data[0] & 0xC0) != 0xC0:
        return False
    if int.from_bytes(data[1:5], "big") == 0:
        return False
    dcid_len = data[5]
    if dcid_len > 20 or len(data) < 6 + dcid_len + 1:
        return False
    scid_pos = 6 + dcid_len
    scid_len = data[scid_pos]
    return scid_len <= 20 and len(data) >= scid_pos + 1 + scid_len


def _salamander_plain(data: bytes, password: bytes) -> bytes:
    if len(data) <= 8 or not password:
        return b""
    salt, payload = data[:8], data[8:]
    mask = hashlib.blake2b(password + salt, digest_size=32).digest()
    return bytes(value ^ mask[index % 32] for index, value in enumerate(payload))


def looks_like_gecko_frame(data: bytes) -> bool:
    if len(data) < 6 or data[0] != 0x80:
        return False
    descriptor = data[2]
    chunk_index = descriptor >> 4
    total_chunks = descriptor & 0x0F
    if not (2 <= total_chunks <= 8 and chunk_index < total_chunks):
        return False
    pad_len = int.from_bytes(data[3:5], "big")
    return 5 + pad_len < len(data)


def looks_like_hysteria(data: bytes, config: EdgeClassifierConfig) -> bool:
    if not config.hysteria_enabled:
        return False
    mode = config.hysteria_mode.strip().lower()
    if mode in {"salamander", "gecko"}:
        plain = _salamander_plain(data, config.hysteria_password)
        return looks_like_quic_long_header(plain) or (mode == "gecko" and looks_like_gecko_frame(plain))
    return False


def classify_initial_datagram(data: bytes, config: EdgeClassifierConfig) -> Protocol | None:
    if looks_like_awg31(data, config):
        return "awg31"
    if looks_like_hysteria(data, config):
        return "hysteria2"
    # Plain QUIC is TUIC only when Hysteria is disabled or is protected by a
    # deterministic Salamander/Gecko marker. Two unmarked QUIC protocols are
    # intentionally treated as ambiguous instead of being guessed.
    hysteria_marked = config.hysteria_mode.strip().lower() in {"salamander", "gecko"}
    if config.tuic_enabled and looks_like_quic_long_header(data) and (not config.hysteria_enabled or hysteria_marked):
        return "tuic"
    if config.hysteria_enabled and not config.tuic_enabled and looks_like_quic_long_header(data):
        return "hysteria2"
    return None


def load_classifier_config() -> EdgeClassifierConfig:
    from app.connections.awg31 import get_settings as get_awg31_settings
    from app.connections.settings import get_connection_settings

    awg = get_awg31_settings()
    h1_low, h1_high = parse_range(awg.parameters.get("H1"))
    h4_low, h4_high = parse_range(awg.parameters.get("H4"))
    xray = get_connection_settings("xray")
    xcfg = dict(xray.config)
    mihomo = get_connection_settings("mihomo")
    mcfg = dict(mihomo.config)
    mode = str(xcfg.get("hysteria2_obfs_mode") or "none").strip().lower()
    return EdgeClassifierConfig(
        awg_enabled=bool(awg.enabled),
        awg_header_key=decode_header_key(awg.header_protection_key),
        awg_s1=int(awg.parameters.get("S1") or 0),
        awg_h1_low=h1_low,
        awg_h1_high=h1_high,
        awg_s4=int(awg.parameters.get("S4") or 0),
        awg_h4_low=h4_low,
        awg_h4_high=h4_high,
        awg_random_trailers=str(awg.parameters.get("RandomTrailers") or "off").lower() == "on",
        hysteria_enabled=bool(xcfg.get("hysteria2_enabled")),
        hysteria_mode=mode,
        hysteria_password=str(xcfg.get("hysteria2_obfs_password") or "").encode("utf-8"),
        tuic_enabled=bool(mcfg.get("tuic_enabled")),
    )
''', encoding='utf-8', newline='\n')

          Path('app/udp_edge/server.py').write_text(r'''from __future__ import annotations

import json
import os
import selectors
import signal
import socket
import time
from dataclasses import dataclass
from pathlib import Path

from app.single_edge import AWG31_UDP_INTERNAL_PORT, HYSTERIA2_UDP_INTERNAL_PORT, PUBLIC_UDP_PORT, TUIC_UDP_INTERNAL_PORT
from app.udp_edge.classifier import Protocol, classify_initial_datagram, load_classifier_config

BACKENDS: dict[Protocol, tuple[str, int]] = {
    "awg31": ("127.0.0.1", AWG31_UDP_INTERNAL_PORT),
    "hysteria2": ("127.0.0.1", HYSTERIA2_UDP_INTERNAL_PORT),
    "tuic": ("127.0.0.1", TUIC_UDP_INTERNAL_PORT),
}
SESSION_TTL = 300.0
MAX_SESSIONS = 4096
STATUS_PATH = Path("/run/sg-gateway/udp-edge-status.json")


@dataclass
class Session:
    protocol: Protocol
    client: tuple
    public_socket: socket.socket
    backend_socket: socket.socket
    last_seen: float


class UdpEdgeServer:
    def __init__(self) -> None:
        self.selector = selectors.DefaultSelector()
        self.sessions: dict[tuple, Session] = {}
        self.running = True
        self.config = load_classifier_config()
        self.config_loaded_at = time.monotonic()
        self.last_status = 0.0
        self.counters = {"awg31": 0, "hysteria2": 0, "tuic": 0, "unknown": 0, "sessions": 0}
        self.public_sockets: list[socket.socket] = []

    def _bind_public(self) -> None:
        for family, address in ((socket.AF_INET, ("0.0.0.0", PUBLIC_UDP_PORT)), (socket.AF_INET6, ("::", PUBLIC_UDP_PORT))):
            sock = socket.socket(family, socket.SOCK_DGRAM)
            sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
            if family == socket.AF_INET6:
                sock.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 1)
            sock.setblocking(False)
            sock.bind(address)
            self.public_sockets.append(sock)
            self.selector.register(sock, selectors.EVENT_READ, ("public", sock))

    def _session_key(self, public_socket: socket.socket, client: tuple) -> tuple:
        return (public_socket.family, str(client[0]), int(client[1]))

    def _close_session(self, key: tuple) -> None:
        session = self.sessions.pop(key, None)
        if session is None:
            return
        try:
            self.selector.unregister(session.backend_socket)
        except Exception:
            pass
        session.backend_socket.close()

    def _new_session(self, key: tuple, protocol: Protocol, public_socket: socket.socket, client: tuple) -> Session:
        if len(self.sessions) >= MAX_SESSIONS:
            oldest = min(self.sessions, key=lambda item: self.sessions[item].last_seen)
            self._close_session(oldest)
        backend = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        backend.setblocking(False)
        backend.connect(BACKENDS[protocol])
        session = Session(protocol, client, public_socket, backend, time.monotonic())
        self.sessions[key] = session
        self.selector.register(backend, selectors.EVENT_READ, ("backend", key))
        self.counters["sessions"] += 1
        return session

    def _reload_config_if_needed(self) -> None:
        now = time.monotonic()
        if now - self.config_loaded_at < 5.0:
            return
        self.config = load_classifier_config()
        self.config_loaded_at = now

    def _handle_public(self, sock: socket.socket) -> None:
        try:
            data, client = sock.recvfrom(65535)
        except BlockingIOError:
            return
        self._reload_config_if_needed()
        key = self._session_key(sock, client)
        session = self.sessions.get(key)
        if session is None:
            protocol = classify_initial_datagram(data, self.config)
            if protocol is None:
                self.counters["unknown"] += 1
                return
            session = self._new_session(key, protocol, sock, client)
        session.last_seen = time.monotonic()
        self.counters[session.protocol] += 1
        try:
            session.backend_socket.send(data)
        except OSError:
            self._close_session(key)

    def _handle_backend(self, key: tuple) -> None:
        session = self.sessions.get(key)
        if session is None:
            return
        try:
            data = session.backend_socket.recv(65535)
        except BlockingIOError:
            return
        except OSError:
            self._close_session(key)
            return
        session.last_seen = time.monotonic()
        try:
            session.public_socket.sendto(data, session.client)
        except OSError:
            self._close_session(key)

    def _expire(self) -> None:
        deadline = time.monotonic() - SESSION_TTL
        for key, session in list(self.sessions.items()):
            if session.last_seen < deadline:
                self._close_session(key)

    def _write_status(self) -> None:
        now = time.monotonic()
        if now - self.last_status < 5.0:
            return
        self.last_status = now
        payload = {
            "public_udp_port": PUBLIC_UDP_PORT,
            "active_sessions": len(self.sessions),
            "counters": dict(self.counters),
            "updated_at": int(time.time()),
        }
        STATUS_PATH.parent.mkdir(parents=True, exist_ok=True)
        temporary = STATUS_PATH.with_suffix(".tmp")
        temporary.write_text(json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8")
        os.replace(temporary, STATUS_PATH)

    def stop(self, *_args) -> None:
        self.running = False

    def run(self) -> None:
        self._bind_public()
        signal.signal(signal.SIGTERM, self.stop)
        signal.signal(signal.SIGINT, self.stop)
        while self.running:
            for key, _mask in self.selector.select(timeout=1.0):
                kind, value = key.data
                if kind == "public":
                    self._handle_public(value)
                else:
                    self._handle_backend(value)
            self._expire()
            self._write_status()
        for key in list(self.sessions):
            self._close_session(key)
        for sock in self.public_sockets:
            try:
                self.selector.unregister(sock)
            except Exception:
                pass
            sock.close()


def main() -> None:
    UdpEdgeServer().run()


if __name__ == "__main__":
    main()
