name: Apply Single Edge 443

on:
  push:
    branches: [feat/2301-single-edge-443]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message || '', 'feat: implement Single Edge 443') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply production changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def rw(path, fn):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=fn(s)
              if n==s: print(f'unchanged: {path}')
              else: p.write_text(n, encoding='utf-8', newline='\n'); print(f'updated: {path}')

          # Xray profile model: private fixed loopback ports plus a dedicated REALITY SNI.
          def profiles(s):
              if 'from app.single_edge import (' not in s:
                  marker='from app.security.tls import overview as tls_overview\n'
                  imp='from app.single_edge import (\n    HYSTERIA2_DEFAULT_PORT,\n    REALITY_TCP_INTERNAL_PORT,\n    XHTTP_REALITY_DEFAULT_SNI,\n    XHTTP_REALITY_DEFAULT_TARGET,\n    XHTTP_REALITY_INTERNAL_PORT,\n    XHTTP_TLS_INTERNAL_PORT,\n)\n'
                  s=s.replace(marker, marker+imp)
              s=s.replace('"reality_tcp_port": _port(config.get("reality_tcp_port"), legacy_port or 443),', '"reality_tcp_port": REALITY_TCP_INTERNAL_PORT,')
              s=s.replace('"xhttp_reality_port": _port(config.get("xhttp_reality_port"), 8444),', '"xhttp_reality_port": XHTTP_REALITY_INTERNAL_PORT,')
              s=s.replace('"xhttp_tls_port": _port(config.get("xhttp_tls_port"), 8445),', '"xhttp_tls_port": XHTTP_TLS_INTERNAL_PORT,')
              s=s.replace('"hysteria2_port": _port(config.get("hysteria2_port"), 8446),', '"hysteria2_port": _port(config.get("hysteria2_port"), HYSTERIA2_DEFAULT_PORT),')
              needle='"xhttp_reality_xmux_enabled": True,\n'
              add='"xhttp_reality_server_name": str(config.get("xhttp_reality_server_name") or XHTTP_REALITY_DEFAULT_SNI).strip().lower(),\n        "xhttp_reality_target": str(config.get("xhttp_reality_target") or XHTTP_REALITY_DEFAULT_TARGET).strip(),\n        '
              if '"xhttp_reality_server_name"' not in s:
                  s=s.replace(needle, needle+'        '+add)
              # Persist the normalized dedicated REALITY SNI/target when saving settings.
              needle2='"xhttp_reality_xmux_enabled": True,\n        "xhttp_tls_enabled": ('
              repl2='"xhttp_reality_xmux_enabled": True,\n        "xhttp_reality_server_name": str(current["xhttp_reality_server_name"]),\n        "xhttp_reality_target": str(current["xhttp_reality_target"]),\n        "xhttp_tls_enabled": ('
              s=s.replace(needle2,repl2)
              return s
          rw('app/xray/profiles.py', profiles)

          # Public exports use edge/443; XHTTP REALITY advertises its own SNI.
          def exports(s):
              if 'from app.single_edge import PUBLIC_TCP_PORT' not in s:
                  s=s.replace('from app.security.tls import overview as tls_overview\n', 'from app.security.tls import overview as tls_overview\nfrom app.single_edge import PUBLIC_TCP_PORT\n')
              anchor='    vless_encryption = str(server_config.get("vless_encryption") or "").strip()\n\n'
              if 'public_profile_port =' not in s:
                  s=s.replace(anchor, anchor+'    public_profile_port = (\n        PUBLIC_TCP_PORT\n        if profile_id in {"reality_tcp", "xhttp_reality", "xhttp_tls"}\n        else profile.port\n    )\n\n')
              s=s.replace('port=profile.port,\n            title=f"{_label(client, device)} · {profile.title}",', 'port=public_profile_port,\n            title=f"{_label(client, device)} · {profile.title}",', 1)
              # second call is XHTTP Reality
              idx=s.find('body = xhttp_reality_link(')
              if idx!=-1:
                  tail=s[idx:]
                  tail=tail.replace('port=profile.port,', 'port=public_profile_port,', 1)
                  tail=tail.replace('server_name=server_name,', 'server_name=str(server_config.get("xhttp_reality_server_name") or server_name),', 1)
                  s=s[:idx]+tail
              # XHTTP TLS endpoint.
              s=s.replace('endpoint = format_host_port(host, profile.port)\n            body = f"vless://{user_id}@{endpoint}?{query}#{safe_name}"', 'endpoint = format_host_port(host, public_profile_port)\n            body = f"vless://{user_id}@{endpoint}?{query}#{safe_name}"')
              return s
          rw('app/clients/exports.py', exports)

          # Runtime: only TCP Xray backends are loopback. Hysteria2 remains public UDP.
          def client_runtime(s):
              if 'from app.single_edge import' not in s:
                  s=s.replace('from app.security.tls import overview as tls_overview\n', 'from app.security.tls import overview as tls_overview\nfrom app.single_edge import XHTTP_REALITY_DEFAULT_SNI, XHTTP_REALITY_DEFAULT_TARGET\n')
              s=s.replace('public_listen = "::"', 'public_listen = "::"\n    tcp_listen = "127.0.0.1"')
              # Rewrite only the three tagged TCP inbound dictionaries.
              for tag in ('sg-vless-reality-tcp','sg-vless-xhttp-reality','sg-vless-xhttp-tls'):
                  pat=re.compile(r'("tag": "'+re.escape(tag)+r'",\n\s*)"listen": public_listen,')
                  s=pat.sub(r'\1"listen": tcp_listen,', s)
              # Some versions use sg-vless-reality tag.
              s=re.sub(r'("tag": "sg-vless-reality",\n\s*)"listen": public_listen,', r'\1"listen": tcp_listen,', s)
              # Dedicated REALITY camouflage for XHTTP Reality.
              old='"target": target,\n                        "xver": 0,\n                        "serverNames": [server_name],'
              # The first occurrence belongs to Reality TCP; replace second occurrence only.
              parts=s.split(old)
              if len(parts)>=3:
                  dedicated='"target": str(settings_config.get("xhttp_reality_target") or XHTTP_REALITY_DEFAULT_TARGET),\n                        "xver": 0,\n                        "serverNames": [str(settings_config.get("xhttp_reality_server_name") or XHTTP_REALITY_DEFAULT_SNI)],'
                  s=old.join(parts[:2])+dedicated+old.join(parts[2:])
              # XHTTP TLS is TLS-terminated by the internal Caddy edge hub.
              pat=re.compile(r'("tag": "sg-vless-xhttp-tls".*?"streamSettings": \{\n\s*"network": "xhttp",\n\s*)"security": "tls",\n\s*"tlsSettings": tls_settings,', re.S)
              s=pat.sub(r'\1"security": "none",', s)
              return s
          rw('hostd/sg_hostd/client_runtime.py', client_runtime)

          # AWG3.1 uses UDP/443, independent from TCP/443.
          rw('app/connections/awg31.py', lambda s: s.replace('PORT = 587', 'PORT = 443'))

          # NaiveProxy becomes the TLS application hub on a loopback-only listener.
          def naive_runtime(s):
              s=s.replace('DEFAULT_PORT = 8447', 'DEFAULT_PORT = 10447')
              if 'PUBLIC_TCP_PORT = 443' not in s:
                  s=s.replace('DEFAULT_PORT = 10447\n', 'DEFAULT_PORT = 10447\nPUBLIC_TCP_PORT = 443\nXHTTP_TLS_INTERNAL_PORT = 10445\nXHTTP_TLS_DEFAULT_PATH = "/sg-xhttp-tls"\n')
              s=s.replace('    return f"""{{\n    admin off', '    xhttp_path = XHTTP_TLS_DEFAULT_PATH\n    return f"""{{\n    admin off')
              s=s.replace('    order forward_proxy before file_server\\n" if active else ""', '    order forward_proxy before reverse_proxy\\n" if active else ""')
              s=s.replace(':{current.port}, {current.domain}:{current.port} {{', '127.0.0.1:{current.port} {{')
              old='''{proxy_block}    file_server {{\n        root {current.site_root}\n    }}'''
              new='''{proxy_block}    @sg_xhttp_tls path {xhttp_path} {xhttp_path}/*\n    reverse_proxy @sg_xhttp_tls h2c://127.0.0.1:{XHTTP_TLS_INTERNAL_PORT}\n    file_server {{\n        root {current.site_root}\n    }}'''
              s=s.replace(old,new)
              s=s.replace('def build_client_uri(settings: NaiveProxySettings, user: NaiveProxyUser, label: str = "") -> str:', 'def build_client_uri(\n    settings: NaiveProxySettings,\n    user: NaiveProxyUser,\n    label: str = "",\n    *,\n    public_port: int = PUBLIC_TCP_PORT,\n) -> str:')
              s=s.replace('f"@{current.domain}:{current.port}{suffix}"', 'f"@{current.domain}:{validate_port(public_port)}{suffix}"')
              return s
          rw('app/naiveproxy/runtime.py', naive_runtime)

          def naive_integration(s):
              # Keep DB/runtime on private port; export always uses public 443.
              old='''            NaiveProxySettings(domain=domain, port=int(settings.port or DEFAULT_PORT)),\n            user,\n            f"{exports._label(client, device)} · NaiveProxy",\n        )'''
              new='''            NaiveProxySettings(domain=domain, port=int(settings.port or DEFAULT_PORT)),\n            user,\n            f"{exports._label(client, device)} · NaiveProxy",\n            public_port=443,\n        )'''
              s=s.replace(old,new)
              return s
          rw('app/naiveproxy/integration.py', naive_integration)

          # Installer: fixed private ports, one TCP/443 edge, no public XHTTP ingress.
          def installer(s):
              s=s.replace('XHTTP_REALITY_PORT="8444"', 'XHTTP_REALITY_PORT="10444"')
              s=s.replace('XHTTP_TLS_PORT="8445"', 'XHTTP_TLS_PORT="10445"')
              s=s.replace('REALITY_INTERNAL_PORT="7443"', 'REALITY_INTERNAL_PORT="10443"')
              s=s.replace('NAIVEPROXY_PORT="8447"', 'NAIVEPROXY_PORT="10447"')
              # Existing DB seed assertions.
              s=s.replace('assert int(row["port"]) == 8447, row["port"]', 'assert int(row["port"]) == 10447, row["port"]')
              # Firewall: migrated XHTTP TCP ports are private. Keep unrelated protocol rules intact.
              s=s.replace('      "${XHTTP_REALITY_PORT}/tcp" "${XHTTP_TLS_PORT}/tcp" \\\n      "${HYSTERIA2_PORT}/udp"', '      "${HYSTERIA2_PORT}/udp"')
              # Add edge routing identities next to Reality defaults.
              if 'SG_GATEWAY_XHTTP_REALITY_SNI=' not in s:
                  s=s.replace('DEFAULT_REALITY_SNI="www.bing.com"\n', 'DEFAULT_REALITY_SNI="www.bing.com"\nSG_GATEWAY_XHTTP_REALITY_SNI="${SG_GATEWAY_XHTTP_REALITY_SNI:-www.cloudflare.com}"\nSG_GATEWAY_TLS_EDGE_SNI="${SG_GATEWAY_TLS_EDGE_SNI:-}"\nNAIVEPROXY_INTERNAL_PORT="10447"\n')
              # Extend placeholder stream map. Do both duplicate installer definitions.
              old='''    ${REALITY_SNI} 127.0.0.1:${REALITY_INTERNAL_PORT};\n    default 127.0.0.1:${REALITY_INTERNAL_PORT};'''
              new='''    ${REALITY_SNI} 127.0.0.1:${REALITY_INTERNAL_PORT};\n    ${SG_GATEWAY_XHTTP_REALITY_SNI} 127.0.0.1:${XHTTP_REALITY_PORT};\n    ${SG_GATEWAY_TLS_EDGE_SNI} 127.0.0.1:${NAIVEPROXY_INTERNAL_PORT};\n    default 127.0.0.1:${REALITY_INTERNAL_PORT};'''
              s=s.replace(old,new)
              s=s.replace('    listen 443;\n    listen [::]:443;', '    listen 443 reuseport;\n    listen [::]:443 reuseport;')
              return s
          rw('install.sh', installer)

          # HTTPS refresh must preserve the same edge map; TLS SNI goes to Caddy hub.
          def panel_access(s):
              s=s.replace('XRAY_INTERNAL_PORT="7443"; PLACEHOLDER_TLS_INTERNAL_PORT="7444"', 'XRAY_INTERNAL_PORT="10443"; XHTTP_REALITY_INTERNAL_PORT="10444"; TLS_EDGE_INTERNAL_PORT="10447"; PLACEHOLDER_TLS_INTERNAL_PORT="7444"')
              if 'XHTTP_REALITY_SNI=' not in s:
                  s=s.replace('REALITY_SNI="$(get_env "$RUNTIME_ENV" SG_GATEWAY_REALITY_SNI www.bing.com)"; REALITY_SNI="${REALITY_SNI,,}"', 'REALITY_SNI="$(get_env "$RUNTIME_ENV" SG_GATEWAY_REALITY_SNI www.bing.com)"; REALITY_SNI="${REALITY_SNI,,}"\nXHTTP_REALITY_SNI="$(get_env "$RUNTIME_ENV" SG_GATEWAY_XHTTP_REALITY_SNI www.cloudflare.com)"; XHTTP_REALITY_SNI="${XHTTP_REALITY_SNI,,}"')
              old='''    $REALITY_SNI 127.0.0.1:$XRAY_INTERNAL_PORT;\n    default $default_backend;'''
              new='''    $REALITY_SNI 127.0.0.1:$XRAY_INTERNAL_PORT;\n    $XHTTP_REALITY_SNI 127.0.0.1:$XHTTP_REALITY_INTERNAL_PORT;\n    $HOST 127.0.0.1:$TLS_EDGE_INTERNAL_PORT;\n    default $default_backend;'''
              s=s.replace(old,new)
              s=s.replace('    listen 443;\n    listen [::]:443;', '    listen 443 reuseport;\n    listen [::]:443 reuseport;')
              return s
          rw('deploy/configure-panel-access.sh', panel_access)

          # Correct visible AWG31 wording.
          p=Path('app/clients/access.py')
          t=p.read_text(encoding='utf-8').replace('профиль на UDP 587.', 'профиль на UDP 443.')
          p.write_text(t, encoding='utf-8', newline='\n')
          PY

      - name: Run targeted contracts
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests/test_sg_gateway_v23_single_edge_443.py
          python -m pytest -q tests/test_preview31_xray_updates.py tests/test_naiveproxy_xray_state_forwarding_2301.py
          bash -n install.sh deploy/configure-panel-access.sh

      - name: Regenerate source checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          tracked=subprocess.check_output(['git','ls-files'], text=True).splitlines()
          paths=[p for p in tracked if p!='SOURCE-SHA256SUMS' and not p.startswith('.github/workflows/')]
          Path('SOURCE-SHA256SUMS').write_text(''.join(f'{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}\n' for p in sorted(paths)), encoding='utf-8')
          PY

      - name: Commit implementation
        run: |
          git config user.name 'SG-Gateway CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app hostd install.sh deploy/configure-panel-access.sh tests SOURCE-SHA256SUMS
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: implement Single Edge 443'
          git push origin HEAD:feat/2301-single-edge-443
