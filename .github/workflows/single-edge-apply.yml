name: Apply all-protocol Single Edge batch

on:
  push:
    branches: [feat/2301-single-edge-443]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2301-single-edge-443
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Apply runtime and export changes
        run: python tools/single_edge_apply.py
      - name: Check Python syntax
        run: python -B -c "from pathlib import Path; files=list(Path('app').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print(f'syntax ok: {len(files)} files')"
      - name: Run Single Edge contract tests
        run: python -m pytest -q tests/test_2301_single_edge_all_protocol_443.py tests/test_2301_single_edge_tls_hub.py
      - name: Refresh source checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          tracked = subprocess.check_output(['git','ls-files','--cached','--others','--exclude-standard'], text=True).splitlines()
          paths = sorted(path for path in tracked if path != 'SOURCE-SHA256SUMS' and not path.startswith('.github/workflows/'))
          body = ''.join(f'{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}\n' for path in paths)
          Path('SOURCE-SHA256SUMS').write_text(body, encoding='utf-8', newline='\n')
          PY
      - name: Commit verified batch
        run: |
          git add app hostd deploy install.sh tests SOURCE-SHA256SUMS
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: route all protocol backends toward single edge 443"
          git push origin HEAD:feat/2301-single-edge-443
