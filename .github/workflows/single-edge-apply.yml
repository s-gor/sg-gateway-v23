name: Apply all-protocol Single Edge batch

on:
  push:
    branches:
      - feat/2301-single-edge-443

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2301-single-edge-443
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Apply runtime and export changes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/single_edge_apply.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('start = text.index("def _apply_singbox()")', 'start = text.index("def _render_singbox_config(")')
          text = text.replace('end = text.index("def apply_split_mihomo_singbox_runtime()")', 'end = text.index("def _sync_singbox_client_configs(")')
          helper_anchor = '''def replace_exact_count(path: str, old: str, new: str, expected: int) -> None:\n'''
          helper = '''def replace_first_of_two(path: str, old: str, new: str) -> None:\n    p = Path(path)\n    text = p.read_text(encoding="utf-8")\n    count = text.count(old)\n    if count != 2:\n        raise SystemExit(f"{path}: expected two occurrences before split replacement, got {count}: {old[:100]!r}")\n    p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\\n")\n\n\n'''
          if 'def replace_first_of_two(' not in text:
              if helper_anchor not in text:
                  raise SystemExit('helper insertion anchor missing')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)
          text = text.replace(
              'replace_once(path, \'f"    port: {settings[\\\'mieru_port\\\']}"\', \'f"    port: {MIERU_TCP_INTERNAL_PORT}"\')',
              'replace_first_of_two(path, \'f"    port: {settings[\\\'mieru_port\\\']}"\', \'f"    port: {MIERU_TCP_INTERNAL_PORT}"\')',
              1,
          )
          text = text.replace(
              'replace_once(path, \'f"    port: {settings[\\\'anytls_port\\\']}"\', \'f"    port: {ANYTLS_TCP_INTERNAL_PORT}"\')',
              'replace_first_of_two(path, \'f"    port: {settings[\\\'anytls_port\\\']}"\', \'f"    port: {ANYTLS_TCP_INTERNAL_PORT}"\')',
              1,
          )
          text = text.replace(
              'replace_once(path, \'f"    port: {settings[\\\'tuic_port\\\']}"\', \'f"    port: {TUIC_UDP_INTERNAL_PORT}"\')',
              'replace_first_of_two(path, \'f"    port: {settings[\\\'tuic_port\\\']}"\', \'f"    port: {TUIC_UDP_INTERNAL_PORT}"\')',
              1,
          )
          old_alpn = '''    replace_once(\n        path,\n        'f"    sni: {_yaml_string(settings[\\'domain\\'])}",\\n                    "    udp: true",',\n        'f"    sni: {_yaml_string(settings[\\'domain\\'])}",\\n                    f"    alpn: [{_yaml_string(ANYTLS_ALPN)}]",\\n                    "    udp: true",',\n    )\n'''
          new_alpn = '''    replace_once(\n        path,\n        '"    alpn: [h2, http/1.1]"',\n        'f"    alpn: [{_yaml_string(ANYTLS_ALPN)}]"',\n    )\n'''
          if old_alpn not in text:
              raise SystemExit('AnyTLS client ALPN patch anchor missing')
          text = text.replace(old_alpn, new_alpn, 1)
          old_firewall = '      "80/tcp" "443/tcp" "443/udp"; do'
          if text.count(old_firewall) != 1:
              raise SystemExit(f'firewall replacement anchor count={text.count(old_firewall)}')
          text = text.replace(old_firewall, '      "80/tcp" "${PANEL_PORT}/tcp" "443/tcp" "443/udp"; do', 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python tools/single_edge_apply.py
      - name: Check Python syntax
        run: |
          python -B -c "from pathlib import Path; files=list(Path('app').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print('syntax ok', len(files), 'files')"
      - name: Run Single Edge contract tests
        run: |
          python -m pytest -q tests/test_2301_single_edge_all_protocol_443.py tests/test_2301_single_edge_tls_hub.py tests/test_2301_udp_edge_classifier.py
      - name: Refresh source checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          tracked = subprocess.check_output(['git','ls-files','--cached','--others','--exclude-standard'], text=True).splitlines()
          paths = sorted(path for path in tracked if path != 'SOURCE-SHA256SUMS' and not path.startswith('.github/workflows/'))
          body = ''.join(f'{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}\n' for path in paths)
          Path('SOURCE-SHA256SUMS').write_text(body, encoding='utf-8', newline='\n')
          PY
      - name: Commit verified batch
        run: |
          git add app hostd deploy install.sh tests SOURCE-SHA256SUMS
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: route all protocol backends toward single edge 443"
          git push origin HEAD:feat/2301-single-edge-443
